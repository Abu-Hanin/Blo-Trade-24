<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>كريم العالمي - صالون الحلاقة</title>
    <link rel="manifest" href="data:application/json,{}" id="manifest-placeholder" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== متغيرات الثيم ===== */
        :root {
            --bg-primary: #181a20;
            --bg-secondary: #1e2329;
            --bg-card: #2b313a;
            --gold: #fcd535;
            --gold-dark: #f0b90b;
            --text-primary: #ffffff;
            --text-secondary: #a0a8b3;
            --border-color: #3b424d;
            --shadow: 0 12px 40px rgba(0,0,0,0.8);
            --radius: 20px;
            --nav-height: 72px;
            --header-height: 64px;
            --transition: 0.3s ease;
        }
        /* الثيم الفاتح */
        body.light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e8e8e8;
            --bg-card: #ffffff;
            --text-primary: #222;
            --text-secondary: #555;
            --border-color: #ccc;
            --shadow: 0 12px 40px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
            direction: rtl;
            transition: background var(--transition), color var(--transition);
        }
        body.ltr { direction: ltr; }
        body.ltr .app-container { direction: ltr; }
        body.ltr .card-gold { border-right: none; border-left: 5px solid var(--gold); }

        .app-container {
            max-width: 430px;
            width: 100%;
            background: var(--bg-primary);
            border-radius: 32px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            height: 820px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border var(--transition);
        }
        /* الهيدر */
        .app-header {
            background: var(--bg-secondary);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            height: var(--header-height);
            transition: background var(--transition);
        }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand i { font-size: 26px; color: var(--gold); }
        .brand-name {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .brand-sub { font-size: 10px; color: var(--text-secondary); display: block; -webkit-text-fill-color: var(--text-secondary); background: none; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-btn {
            background: var(--bg-primary); border: 1px solid var(--border-color);
            color: var(--text-secondary); width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 16px;
        }
        .header-btn:hover { border-color: var(--gold); color: var(--gold); }
        .user-badge {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-primary); padding: 2px 12px 2px 8px;
            border-radius: 30px; border: 1px solid var(--border-color);
            cursor: pointer; transition: 0.2s; font-size: 12px; color: var(--text-secondary);
        }
        .user-badge:hover { border-color: var(--gold); }
        .user-badge i { font-size: 20px; color: var(--gold); }

        /* المحتوى */
        .main-content { flex: 1; overflow-y: auto; padding: 14px 14px 8px; scroll-behavior: smooth; }
        .main-content::-webkit-scrollbar { width: 4px; }
        .main-content::-webkit-scrollbar-track { background: var(--bg-primary); }
        .main-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .page { display: none; animation: fadeUp 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }

        /* البطاقات */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border var(--transition);
        }
        .card-gold { border-right: 5px solid var(--gold); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: var(--gold); }

        /* الخدمات في الرئيسية */
        .service-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border-color);
        }
        .service-item:last-child { border-bottom: none; }
        .service-info { display: flex; align-items: center; gap: 12px; }
        .service-icon {
            width: 40px; height: 40px;
            background: rgba(252,213,53,0.12);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--gold); font-size: 18px;
        }
        .service-name { font-weight: 600; font-size: 16px; }
        .service-price {
            color: var(--gold); font-weight: 800; font-size: 20px;
            background: rgba(252,213,53,0.08);
            padding: 2px 14px; border-radius: 30px;
            border: 1px solid rgba(252,213,53,0.2);
        }
        .service-actions { display: flex; gap: 8px; align-items: center; }
        .btn-order {
            background: var(--gold); color: var(--bg-primary);
            border: none; padding: 6px 16px; border-radius: 30px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-order:hover { background: var(--gold-dark); transform: scale(1.05); }

        /* العروض */
        .offer-card {
            background: linear-gradient(145deg, #2b313a, #1e2329);
            border: 1px solid var(--gold);
            border-radius: var(--radius);
            padding: 18px; margin-bottom: 14px;
            position: relative; overflow: hidden;
            transition: 0.3s;
        }
        .offer-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(252,213,53,0.2); }
        .offer-card::before { content: '👑'; position: absolute; top: -8px; left: -8px; font-size: 60px; opacity: 0.1; transform: rotate(-15deg); }
        .offer-title { font-size: 20px; font-weight: 700; color: var(--gold); }
        .offer-price { font-size: 26px; font-weight: 800; color: #fff; }
        .offer-desc { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
        .offer-details-btn {
            background: transparent; border: 2px solid var(--gold);
            color: var(--gold); padding: 6px 18px; border-radius: 30px;
            cursor: pointer; transition: 0.3s; font-weight: 600; margin-top: 8px;
        }
        .offer-details-btn:hover { background: var(--gold); color: var(--bg-primary); }

        /* الحجوزات - جدول */
        .booking-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .booking-table th { background: var(--gold); color: var(--bg-primary); padding: 8px; text-align: center; }
        .booking-table td { padding: 8px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .booking-table tr:hover { background: rgba(252,213,53,0.05); }

        /* الملف الشخصي */
        .profile-avatar {
            width: 90px; height: 90px; background: var(--gold);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 44px; color: var(--bg-primary); margin: 0 auto 14px;
            border: 4px solid var(--gold-dark);
        }
        .profile-name { font-size: 22px; font-weight: 700; text-align: center; }
        .profile-email { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }

        /* لوحة الأدمن */
        .admin-panel {
            background: var(--bg-secondary); border: 1px solid var(--gold);
            border-radius: var(--radius); padding: 16px; margin-top: 10px;
        }
        .admin-service-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-color);
        }
        .admin-service-item:last-child { border-bottom: none; }
        .admin-actions { display: flex; gap: 6px; }
        .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 30px; }

        /* الأزرار العامة */
        .btn {
            padding: 12px 20px; border: none; border-radius: 14px;
            font-weight: 700; font-size: 15px; cursor: pointer;
            transition: all 0.25s; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
            width: 100%;
        }
        .btn-gold { background: var(--gold); color: var(--bg-primary); }
        .btn-gold:hover { background: var(--gold-dark); transform: scale(1.02); box-shadow: 0 8px 20px rgba(252,213,53,0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--gold); color: var(--gold); }
        .btn-outline:hover { background: var(--gold); color: var(--bg-primary); }
        .btn-google { background: #fff; color: #222; border: 1px solid #ccc; }
        .btn-google:hover { background: #f0f0f0; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 6px 16px; font-size: 13px; width: auto; }

        .toast {
            background: var(--gold); color: var(--bg-primary);
            padding: 12px 16px; border-radius: 14px; font-weight: 600;
            font-size: 14px; display: none; align-items: center; gap: 10px;
            margin-top: 12px;
        }
        .toast.show { display: flex; }

        /* النماذج */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-primary); font-size: 15px;
            outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold); box-shadow: 0 0 0 4px rgba(252,213,53,0.15);
        }

        /* التنقل السفلي */
        .bottom-nav {
            background: var(--bg-secondary); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around;
            padding: 4px 0 6px; flex-shrink: 0; height: var(--nav-height);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: var(--text-secondary); font-size: 11px; cursor: pointer;
            transition: 0.2s; padding: 4px 10px; border-radius: 12px;
            background: transparent; border: none; font-family: inherit;
            min-width: 50px;
        }
        .nav-item i { font-size: 22px; transition: 0.2s; }
        .nav-item.active { color: var(--gold); }
        .nav-item.active i { transform: translateY(-2px); text-shadow: 0 0 12px rgba(252,213,53,0.3); }
        .nav-item:hover { color: var(--gold); }

        /* مودال التفاصيل */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-secondary); max-width: 380px; width: 90%;
            border-radius: var(--radius); padding: 24px; border: 1px solid var(--gold);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-box h3 { color: var(--gold); margin-bottom: 12px; }
        .modal-box ul { list-style: none; padding: 0; }
        .modal-box ul li { padding: 8px 0; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        .modal-box ul li i { color: var(--gold); width: 20px; }
        .modal-close { margin-top: 16px; }

        /* تذييل */
        .text-muted { color: var(--text-secondary); }
        .text-gold { color: var(--gold); }
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-10 { gap: 10px; }

        /* زر تثبيت التطبيق */
        .install-btn {
            background: var(--gold); color: var(--bg-primary);
            border: none; padding: 6px 16px; border-radius: 30px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: 0.2s;
        }
        .install-btn:hover { background: var(--gold-dark); transform: scale(1.05); }

        @media (max-width:460px) {
            .app-container { height: 100vh; border-radius: 0; max-width:100%; }
            .brand-name { font-size: 18px; }
            .service-price { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- الهيدر -->
    <header class="app-header">
        <div class="brand">
            <i class="fas fa-scissors"></i>
            <div>
                <span class="brand-name">كريم العالمي</span>
                <span class="brand-sub">صالون الحلاقة</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="themeToggle" title="الوضع الليلي/النهاري"><i class="fas fa-moon"></i></button>
            <button class="install-btn" id="installAppBtn"><i class="fas fa-download"></i> تثبيت</button>
            <div class="user-badge" id="userBadge" title="الملف الشخصي">
                <i class="fas fa-user-circle"></i>
                <span id="userBadgeName">زائر</span>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="main-content" id="mainContent">

        <!-- ===== الصفحة الرئيسية ===== -->
        <section class="page active" id="page-home">
            <div class="card card-gold">
                <div class="flex-between">
                    <div><h2 style="font-size:22px;">مرحباً بك 👋</h2><p class="text-muted" style="font-size:14px;">اختر خدمتك واضغط "طلب"</p></div>
                    <i class="fas fa-crown" style="font-size:38px; color:var(--gold);"></i>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-list"></i> خدماتنا</span>
                    <span class="text-muted" style="font-size:13px;">طلب فوري</span>
                </div>
                <div class="service-grid" id="serviceList"></div>
            </div>
        </section>

        <!-- ===== صفحة العروض ===== -->
        <section class="page" id="page-offers">
            <div class="card card-gold">
                <div class="card-title"><i class="fas fa-ring"></i> عروض العريس المميزة</div>
                <div id="offersContainer"></div>
            </div>
        </section>

        <!-- ===== صفحة الحجوزات ===== -->
        <section class="page" id="page-bookings">
            <div class="card">
                <div class="card-title"><i class="fas fa-history"></i> سجل الحجوزات</div>
                <div id="bookingsList">
                    <p class="text-muted text-center">لا توجد حجوزات حتى الآن</p>
                </div>
            </div>
        </section>

        <!-- ===== صفحة الملف الشخصي ===== -->
        <section class="page" id="page-profile">
            <div class="card text-center">
                <div class="profile-avatar" id="profileAvatar"><i class="fas fa-user"></i></div>
                <div class="profile-name" id="profileName">زائر</div>
                <div class="profile-email" id="profileEmail">غير مسجل</div>
                <div class="profile-phone" id="profilePhone" style="text-align:center;color:var(--text-secondary);font-size:14px;"></div>
                <div style="display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" id="loginBtn"><i class="fas fa-sign-in-alt"></i> تسجيل دخول</button>
                    <button class="btn btn-outline btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
                    <button class="btn btn-outline btn-sm" id="langToggle"><i class="fas fa-globe"></i> English</button>
                </div>
            </div>
            <!-- لوحة الأدمن -->
            <div id="adminPanel" class="admin-panel hidden">
                <div class="card-title"><i class="fas fa-cog"></i> لوحة التحكم (أدمن)</div>
                <div id="adminServiceList"></div>
                <hr style="border-color:var(--border-color); margin:16px 0;" />
                <div class="form-group"><label>اسم الخدمة الجديدة</label><input type="text" id="newServiceName" placeholder="مثل: حلاقة مميزة" /></div>
                <div class="form-group"><label>السعر (جنيه)</label><input type="number" id="newServicePrice" placeholder="مثل: 60" /></div>
                <button class="btn btn-gold btn-sm" id="addServiceBtn"><i class="fas fa-plus"></i> إضافة خدمة</button>
                <p class="text-muted mt-8" style="font-size:12px;">* التعديلات تحفظ محلياً وتظهر فوراً</p>
            </div>
        </section>

    </main>

    <!-- التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="page-home"><i class="fas fa-home"></i><span>الرئيسية</span></button>
        <button class="nav-item" data-page="page-offers"><i class="fas fa-gem"></i><span>العروض</span></button>
        <button class="nav-item" data-page="page-bookings"><i class="fas fa-calendar-check"></i><span>الحجوزات</span></button>
        <button class="nav-item" data-page="page-profile"><i class="fas fa-user"></i><span>الملف</span></button>
    </nav>
</div>

<!-- مودال التفاصيل -->
<div class="modal-overlay" id="offerModal">
    <div class="modal-box">
        <h3 id="modalTitle">تفاصيل العرض</h3>
        <ul id="modalDetails"></ul>
        <button class="btn btn-gold modal-close" id="modalCloseBtn">إغلاق</button>
    </div>
</div>

<script>
    // ====================================================================
    //  1. البيانات الأساسية
    // ====================================================================
    const DEFAULT_SERVICES = [
        { name: 'حلقة أطفال', price: 20 },
        { name: 'الشبّة', price: 40 },
        { name: 'حلقة الرجل', price: 50 },
        { name: 'حلق الرأس فقط', price: 30 },
        { name: 'حلق الدقن', price: 30 },
        { name: 'حلق رأس ودقن', price: 50 },
        { name: 'فوطة سخنة', price: 30 }
    ];

    // عروض العريس مع تفاصيلها
    const OFFERS = [
        {
            name: '💍 حلقة العريس (حنة)',
            price: 300,
            details: ['حلق شعر الرأس', 'حلق الدقن', 'مساج للبشرة', 'ماسك لتفتيح البشرة', 'بخار ساخن وبارد', 'علاج للشعر']
        },
        {
            name: '👑 حلقة العريس (حنة ودخلة)',
            price: 500,
            details: ['حلق شعر الرأس', 'حلق الدقن', 'مساج للبشرة', 'ماسك لتفتيح البشرة', 'بخار ساخن وبارد', 'علاج للشعر', 'استشوار وكريم لتفتيح البشرة', 'تاكيدات امتيازات إضافية', 'يوم الدخلة مجاناً']
        }
    ];

    // ====================================================================
    //  2. التخزين المحلي (الخدمات والحجوزات والمستخدم)
    // ====================================================================
    function loadServices() {
        const stored = localStorage.getItem('kareem_services');
        if (stored) { try { return JSON.parse(stored); } catch(e) {} }
        return DEFAULT_SERVICES.slice();
    }
    function saveServices(s) { localStorage.setItem('kareem_services', JSON.stringify(s)); }
    let services = loadServices();

    // الحجوزات
    function loadBookings() {
        const data = localStorage.getItem('kareem_bookings');
        if (data) { try { return JSON.parse(data); } catch(e) {} }
        return [];
    }
    function saveBookings(b) { localStorage.setItem('kareem_bookings', JSON.stringify(b)); }
    let bookings = loadBookings();

    // المستخدم
    const ADMIN_EMAIL = "swlyd3393@gmail.com";
    const STORAGE_USER_KEY = 'kareem_user';
    function loadUser() {
        const data = localStorage.getItem(STORAGE_USER_KEY);
        if (data) { try { return JSON.parse(data); } catch(e) {} }
        return null;
    }
    function saveUser(u) {
        if (u) localStorage.setItem(STORAGE_USER_KEY, JSON.stringify(u));
        else localStorage.removeItem(STORAGE_USER_KEY);
    }
    let currentUser = loadUser();

    // تفضيلات الثيم واللغة
    let currentTheme = localStorage.getItem('kareem_theme') || 'dark';
    let currentLang = localStorage.getItem('kareem_lang') || 'ar';

    // ====================================================================
    //  3. عناصر DOM
    // ====================================================================
    const $ = id => document.getElementById(id);
    const pageHome = $('page-home'), pageOffers = $('page-offers'), pageBookings = $('page-bookings'), pageProfile = $('page-profile');
    const allPages = [pageHome, pageOffers, pageBookings, pageProfile];
    const navItems = document.querySelectorAll('.nav-item');
    const serviceListEl = $('serviceList');
    const offersContainer = $('offersContainer');
    const bookingsList = $('bookingsList');
    const profileName = $('profileName'), profileEmail = $('profileEmail'), profilePhone = $('profilePhone');
    const profileAvatar = $('profileAvatar');
    const userBadgeName = $('userBadgeName');
    const loginBtn = $('loginBtn'), logoutBtn = $('logoutBtn');
    const adminPanel = $('adminPanel'), adminServiceList = $('adminServiceList');
    const addServiceBtn = $('addServiceBtn'), newServiceName = $('newServiceName'), newServicePrice = $('newServicePrice');
    const themeToggle = $('themeToggle'), langToggle = $('langToggle');
    const userBadge = $('userBadge');
    const installBtn = $('installAppBtn');
    const modalOverlay = $('offerModal'), modalTitle = $('modalTitle'), modalDetails = $('modalDetails'), modalCloseBtn = $('modalCloseBtn');

    // ====================================================================
    //  4. الوظائف الأساسية للعرض
    // ====================================================================
    function renderServices() {
        let html = '';
        services.forEach((s, idx) => {
            html += `
                <div class="service-item">
                    <div class="service-info">
                        <div class="service-icon"><i class="fas fa-cut"></i></div>
                        <span class="service-name">${s.name}</span>
                    </div>
                    <div class="service-actions">
                        <span class="service-price">${s.price} ج.م</span>
                        <button class="btn-order" data-index="${idx}"><i class="fas fa-shopping-cart"></i> طلب</button>
                    </div>
                </div>
            `;
        });
        serviceListEl.innerHTML = html;

        // ربط أزرار الطلب
        document.querySelectorAll('.btn-order').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                const service = services[idx];
                requestService(service);
            });
        });
    }

    function renderOffers() {
        let html = '';
        OFFERS.forEach((offer, idx) => {
            html += `
                <div class="offer-card">
                    <div class="flex-between">
                        <div>
                            <div class="offer-title">${offer.name}</div>
                            <div class="offer-desc">${offer.details.slice(0,2).join('، ')} ...</div>
                        </div>
                        <div class="offer-price">${offer.price} ج.م</div>
                    </div>
                    <button class="offer-details-btn" data-index="${idx}"><i class="fas fa-info-circle"></i> تفاصيل العرض</button>
                </div>
            `;
        });
        offersContainer.innerHTML = html;

        document.querySelectorAll('.offer-details-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                showOfferDetails(idx);
            });
        });
    }

    function renderBookings() {
        if (bookings.length === 0) {
            bookingsList.innerHTML = `<p class="text-muted text-center">لا توجد حجوزات حتى الآن</p>`;
            return;
        }
        let html = `<table class="booking-table"><thead><tr><th>العميل</th><th>الهاتف</th><th>الخدمة</th><th>التاريخ</th></tr></thead><tbody>`;
        bookings.slice().reverse().forEach(b => {
            html += `<tr><td>${b.name}</td><td>${b.phone}</td><td>${b.service}</td><td>${b.time}</td></tr>`;
        });
        html += `</tbody></table>`;
        bookingsList.innerHTML = html;
    }

    function renderAdminPanel() {
        if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
            adminPanel.classList.add('hidden');
            return;
        }
        adminPanel.classList.remove('hidden');
        let html = '';
        services.forEach((s, idx) => {
            html += `
                <div class="admin-service-item">
                    <span>${s.name}</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="service-price" style="font-size:14px;">${s.price} ج.م</span>
                        <div class="admin-actions">
                            <button class="btn btn-sm btn-gold" data-index="${idx}" data-action="edit"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" data-index="${idx}" data-action="delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
        adminServiceList.innerHTML = html;

        document.querySelectorAll('[data-action="edit"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                const newName = prompt('أدخل الاسم الجديد:', services[idx].name);
                if (newName && newName.trim()) {
                    const newPrice = prompt('أدخل السعر الجديد:', services[idx].price);
                    if (newPrice !== null && !isNaN(newPrice) && Number(newPrice) >= 0) {
                        services[idx].name = newName.trim();
                        services[idx].price = Number(newPrice);
                        saveServices(services);
                        renderAll();
                    }
                }
            });
        });

        document.querySelectorAll('[data-action="delete"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                if (confirm(`هل تريد حذف خدمة "${services[idx].name}"؟`)) {
                    services.splice(idx, 1);
                    saveServices(services);
                    renderAll();
                }
            });
        });
    }

    function addNewService() {
        const name = newServiceName.value.trim();
        const price = Number(newServicePrice.value);
        if (!name || isNaN(price) || price < 0) {
            alert('الرجاء إدخال اسم وسعر صحيحين');
            return;
        }
        services.push({ name, price });
        saveServices(services);
        newServiceName.value = '';
        newServicePrice.value = '';
        renderAll();
    }
    addServiceBtn.addEventListener('click', addNewService);

    // ====================================================================
    //  5. طلب الخدمة (نقرة واحدة)
    // ====================================================================
    function requestService(service) {
        if (!currentUser) {
            alert('الرجاء تسجيل الدخول أولاً');
            navigateTo('page-profile');
            return;
        }
        const name = currentUser.name || 'عميل';
        const phone = currentUser.phone || 'غير مسجل';
        const now = new Date();
        const time = now.toLocaleString('ar-EG', { hour12: true });
        const serviceName = service.name;
        const price = service.price;

        // حفظ الحجز
        const booking = { name, phone, service: serviceName, time, price };
        bookings.push(booking);
        saveBookings(bookings);

        // إرسال واتساب
        const ownerPhone = "201154846407";
        const message = `📢 *طلب خدمة فوري من كريم العالمي*%0A🧑 العميل: ${name}%0A📞 الهاتف: ${phone}%0A✂️ الخدمة: ${serviceName}%0A💰 السعر: ${price} ج.م%0A🕒 الوقت: ${time}`;
        const waLink = `https://wa.me/${ownerPhone}?text=${message}`;
        window.open(waLink, '_blank');

        // إشعار محلي
        alert(`✅ تم إرسال طلب "${serviceName}" إلى واتساب`);

        // تحديث صفحة الحجوزات
        renderBookings();
    }

    // ====================================================================
    //  6. عرض تفاصيل العروض (مودال)
    // ====================================================================
    function showOfferDetails(index) {
        const offer = OFFERS[index];
        modalTitle.textContent = offer.name;
        let html = '';
        offer.details.forEach(d => {
            html += `<li><i class="fas fa-check-circle"></i> ${d}</li>`;
        });
        modalDetails.innerHTML = html;
        modalOverlay.classList.add('show');
    }
    modalCloseBtn.addEventListener('click', () => modalOverlay.classList.remove('show'));
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) modalOverlay.classList.remove('show');
    });

    // ====================================================================
    //  7. التنقل بين الصفحات
    // ====================================================================
    function navigateTo(pageId) {
        allPages.forEach(p => p.classList.remove('active'));
        const target = document.getElementById(pageId);
        if (target) target.classList.add('active');
        navItems.forEach(item => {
            item.classList.toggle('active', item.dataset.page === pageId);
        });
        if (pageId === 'page-profile') {
            updateProfileUI();
            renderAdminPanel();
        }
        if (pageId === 'page-bookings') renderBookings();
        if (pageId === 'page-offers') renderOffers();
    }

    navItems.forEach(item => {
        item.addEventListener('click', function() {
            navigateTo(this.dataset.page);
        });
    });
    userBadge.addEventListener('click', () => navigateTo('page-profile'));

    // ====================================================================
    //  8. تحديث واجهة المستخدم
    // ====================================================================
    function updateProfileUI() {
        if (currentUser) {
            profileName.textContent = currentUser.name || 'مستخدم';
            profileEmail.textContent = currentUser.email || 'غير مسجل';
            profilePhone.textContent = '📞 ' + (currentUser.phone || 'غير مسجل');
            profileAvatar.innerHTML = `<i class="fas fa-user-circle" style="font-size:60px;"></i>`;
            userBadgeName.textContent = (currentUser.name || currentUser.email || 'مستخدم').slice(0,10);
        } else {
            profileName.textContent = 'زائر';
            profileEmail.textContent = 'غير مسجل';
            profilePhone.textContent = '';
            profileAvatar.innerHTML = `<i class="fas fa-user"></i>`;
            userBadgeName.textContent = 'زائر';
        }
    }

    // ====================================================================
    //  9. تسجيل الدخول والخروج
    // ====================================================================
    function showLoginDialog() {
        const name = prompt('أدخل اسمك الكامل:', currentUser ? currentUser.name : '');
        if (name === null) return;
        const email = prompt('أدخل بريدك الإلكتروني:', currentUser ? currentUser.email : '');
        if (email === null) return;
        const phone = prompt('أدخل رقم هاتفك:', currentUser ? currentUser.phone : '');
        if (phone === null) return;
        if (name.trim() && email.trim() && phone.trim()) {
            currentUser = { name: name.trim(), email: email.trim(), phone: phone.trim() };
            saveUser(currentUser);
            renderAll();
            if (currentUser.email === ADMIN_EMAIL) alert('✅ مرحباً أيها الأدمن! لوحة التحكم متاحة.');
            else alert('✅ تم تسجيل الدخول بنجاح.');
        } else alert('الرجاء ملء جميع الحقول.');
    }
    loginBtn.addEventListener('click', showLoginDialog);
    logoutBtn.addEventListener('click', function() {
        if (confirm('هل تريد تسجيل الخروج؟')) {
            currentUser = null;
            saveUser(null);
            renderAll();
            alert('تم تسجيل الخروج.');
        }
    });

    // ====================================================================
    //  10. الثيم واللغة
    // ====================================================================
    function applyTheme(theme) {
        document.body.classList.toggle('light-theme', theme === 'light');
        themeToggle.innerHTML = theme === 'light' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        localStorage.setItem('kareem_theme', theme);
        currentTheme = theme;
    }
    themeToggle.addEventListener('click', function() {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    function applyLanguage(lang) {
        const isRTL = lang === 'ar';
        document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
        document.body.classList.toggle('ltr', !isRTL);
        langToggle.innerHTML = isRTL ? '<i class="fas fa-globe"></i> English' : '<i class="fas fa-globe"></i> عربي';
        localStorage.setItem('kareem_lang', lang);
        currentLang = lang;
        // تغيير نصوص ثابتة إذا أردت (يمكن توسيعها)
    }
    langToggle.addEventListener('click', function() {
        applyLanguage(currentLang === 'ar' ? 'en' : 'ar');
    });

    // ====================================================================
    //  11. تثبيت التطبيق (PWA)
    // ====================================================================
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'flex';
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                alert('✅ تم تثبيت التطبيق بنجاح');
            } else {
                alert('❌ تم إلغاء التثبيت');
            }
            deferredPrompt = null;
            installBtn.style.display = 'none';
        } else {
            alert('يمكنك تثبيت التطبيق من قائمة المتصفح (إضافة إلى الشاشة الرئيسية)');
        }
    });
    // إخفاء الزر إذا لم يكن PWA مدعوماً
    if (!window.matchMedia('(display-mode: standalone)').matches) {
        // نتركه ظاهراً
    }

    // ====================================================================
    //  12. دالة التحديث الشامل
    // ====================================================================
    function renderAll() {
        renderServices();
        renderOffers();
        renderBookings();
        renderAdminPanel();
        updateProfileUI();
    }

    // ====================================================================
    //  13. تهيئة التطبيق
    // ====================================================================
    document.addEventListener('DOMContentLoaded', function() {
        // تطبيق الثيم واللغة المحفوظين
        applyTheme(currentTheme);
        applyLanguage(currentLang);
        renderAll();
        navigateTo('page-home');
        console.log('✅ تطبيق كريم العالمي - النسخة المتكاملة جاهزة');
    });
</script>
</body>
</html>
