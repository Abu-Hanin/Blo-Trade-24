<script>
(function() {
let deferredPrompt = null;
const installBtn = document.getElementById('installAppBtn');
const iosMsg = document.getElementById('iosGuideMsg');
const toastEl = document.getElementById('installToast');
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
if (isStandalone()) {
if (installBtn) installBtn.style.display = 'none';
if (iosMsg) iosMsg.classList.remove('show');
return;
}
const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
if (isIOS) {
if (installBtn) installBtn.style.display = 'none';
if (iosMsg) iosMsg.classList.add('show');
} else {
window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredPrompt = e;
if (installBtn) installBtn.style.display = 'inline-flex';
});
window.addEventListener('appinstalled', () => {
deferredPrompt = null;
if (installBtn) installBtn.style.display = 'none';
});
}
if (installBtn) {
installBtn.addEventListener('click', async () => {
if (!deferredPrompt) return;
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt = null;
installBtn.style.display = 'none';
});
}
})();
</script>

});

}

}

const t = card.querySelector('.card-title');
if (t) copyText(t.innerText.trim());
});
function loadPosts() {

};

}

})();

<body>
<header>
<div class="logo"><i class="fas fa-coins"></i></div>
<h1>توصيات للتداول الفوري</h1>

</header>
<div class="container">

</div>
<div id="cards-container" class="cards-container"><div class="loading"><i class="fas fa-spinner"></i><p>جاري التحميل...</p></div></div>
</div>
<div class="copy-notification" id="copy-notification">تم النسخ!</div>
<script>
const samplePosts = [
{ title: "DOGE USDT توصية تداول", content: "<p>توصية شراء عند 0.2114 هدف 0.2150 وقف 0.1280</p>", date: new Date().toISOString().split('T')[0] },
{ title: "BTC USDT توصية تداول", content: "<p>توصية شراء عند 34,500 هدف 35,200 وقف 34,000</p>", date: new Date().toISOString().split('T')[0] },
{ title: "ETH USDT توصية تداول", content: "<p>توصية بيع عند 0.065 هدف 0.063 وقف 0.067</p>", date: new Date().toISOString().split('T')[0] },
{ title: "XRP USDT توصية تداول", content: "<p>توصية شراء عند 0.65 هدف 0.68 وقف 0.62</p>", date: new Date().toISOString().split('T')[0] },
{ title: "ADA USDT توصية تداول", content: "<p>توصية شراء عند 0.38 هدف 0.42 وقف 0.35</p>", date: new Date().toISOString().split('T')[0] }
];
let allCurrencyPrices = {}, priceUpdateInterval;
function extractCurrencyPair(title) {
const m = title.match(/([A-Za-z]+)[\/\s]+([A-Za-z]+)/i);
if (m) return m[1].toUpperCase() + 'USDT';
const c = ['BTC','ETH','XRP','BNB','ADA','DOGE','DOT','LTC','BCH','LINK','SOL','MATIC','AVAX','ATOM'];
for (const x of c) { if (title.toUpperCase().includes(x)) return x + 'USDT'; }
return null;
}
async function fetchCurrencyPrice(symbol) {
try { const r = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=' + symbol); if (!r.ok) throw 0; const d = await r.json(); return { price: parseFloat(d.lastPrice), change: parseFloat(d.priceChangePercent), symbol }; }
catch (e) { return null; }
}
async function updateAllPrices(symbols) {
const uniq = [...new Set(symbols.filter(s => s))];
const results = await Promise.all(uniq.map(fetchCurrencyPrice));
results.forEach(p => { if (p) allCurrencyPrices[p.symbol] = p; });
updatePriceDisplays();
}
function updatePriceDisplays() {
document.querySelectorAll('.card').forEach(card => {
const title = card.querySelector('.card-header').textContent;
const sym = extractCurrencyPair(title);
if (sym && allCurrencyPrices[sym]) {
const p = allCurrencyPrices[sym], pos = p.change >= 0;
let info = card.querySelector('.price-info');
if (!info) { info = document.createElement('div'); info.className = 'price-info'; card.querySelector('.card-header').appendChild(info); }
info.innerHTML = '<span class="current-price">$' + p.price.toFixed(4) + '</span><span class="price-change ' + (pos ? 'price-up' : 'price-down') + '">' + (pos ? '▲' : '▼') + ' ' + Math.abs(p.change).toFixed(2) + '%</span>';
}
});
}
function showCopyNotification() {
const n = document.getElementById('copy-notification');
n.classList.add('show');
setTimeout(() => n.classList.remove('show'), 2000);
}
async function loadPosts() {
const url = 'https://walidsalama1.blogspot.com/feeds/posts/default?alt=json-in-script&callback=processRSSResponse';
try {
const old = document.querySelector('script[src*="blogspot.com"]');
if (old) old.remove();
const s = document.createElement('script');
s.src = url;
document.head.appendChild(s);
} catch (e) { displayPosts(samplePosts); }
}
function processRSSResponse(data) {
if (data.feed && data.feed.entry) displayPosts(data.feed.entry);
else displayPosts(samplePosts);
}
async function displayPosts(posts) {
const container = document.getElementById('cards-container');
container.innerHTML = '';
const symbols = [];
const list = [];
posts.forEach(post => {
const title = post.title ? (post.title.$t || post.title) : 'توصية';
const sym = extractCurrencyPair(title);
if (sym) symbols.push(sym);
list.push({ post, title, sym });
});
if (symbols.length) { await updateAllPrices(symbols); priceUpdateInterval = setInterval(() => updateAllPrices(symbols), 10000); }
list.forEach(({ post, title, sym }) => {
const content = post.content ? (post.content.$t || post.content) : '';
let date;
if (post.published) date = new Date(post.published.$t).toLocaleDateString('ar-EG');
else date = new Date(post.date || Date.now()).toLocaleDateString('ar-EG');
const card = document.createElement('div');
card.className = 'card';
let priceHTML = '';
if (sym && allCurrencyPrices[sym]) {
const p = allCurrencyPrices[sym], pos = p.change >= 0;
priceHTML = '<div class="price-info"><span class="current-price">$' + p.price.toFixed(4) + '</span><span class="price-change ' + (pos ? 'price-up' : 'price-down') + '">' + (pos ? '▲' : '▼') + ' ' + Math.abs(p.change).toFixed(2) + '%</span></div>';
}
card.innerHTML = '<div class="card-header">' + title + priceHTML + '<span class="post-date">📅 ' + date + '</span></div><div class="card-body"><div class="post-content">' + content + '</div></div><div class="card-footer"><div class="social-share"><a href="#"><i class="fab fa-facebook"></i></a><a href="#"><i class="fab fa-twitter"></i></a><a href="#"><i class="fab fa-linkedin"></i></a></div></div>';
card.querySelector('.card-header').addEventListener('click', () => { navigator.clipboard.writeText(title).then(showCopyNotification); });
container.appendChild(card);
});
document.getElementById('search-input').addEventListener('input', function() {
const term = this.value.toLowerCase();
document.querySelectorAll('.card').forEach(card => {
const t = card.querySelector('.card-header').textContent.toLowerCase();
const c = card.querySelector('.post-content').textContent.toLowerCase();
card.style.display = (t.includes(term) || c.includes(term)) ? 'block' : 'none';
});
});
document.getElementById('today-posts').textContent = posts.length;
}
document.getElementById('refresh-btn').addEventListener('click', function() {
document.getElementById('cards-container').innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>جاري التحديث...</p></div>';
setTimeout(loadPosts, 500);
});
loadPosts();
</script>
</body>
</html>
</template>

<body>

<script>
const coinSymbols = ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","ADAUSDT","DOGEUSDT","DOTUSDT","AVAXUSDT","LINKUSDT","XMRUSDT","NEARUSDT","ATOMUSDT","UNIUSDT","FILUSDT","APTUSDT","MATICUSDT","LTCUSDT","ICPUSDT","ETCUSDT","HBARUSDT","XLMUSDT","VETUSDT","ALGOUSDT","XTZUSDT","THETAUSDT","EOSUSDT","AAVEUSDT","MKRUSDT","BSVUSDT","AXSUSDT","EGLDUSDT","NEOUSDT","KLAYUSDT","FTMUSDT","WAVESUSDT","ZECUSDT","DASHUSDT","RUNEUSDT","BCHUSDT","SANDUSDT","MANAUSDT","CRVUSDT","GALAUSDT","ENJUSDT","GMTUSDT","APEUSDT","CHZUSDT","GRTUSDT","QNTUSDT","BATUSDT","SNXUSDT","KSMUSDT","ARUSDT","COMPUSDT","YFIUSDT","LRCUSDT","ONEUSDT","STORJUSDT","ENSUSDT","IMXUSDT","DYDXUSDT","SUSHIUSDT","OMGUSDT","ANKRUSDT","JASMYUSDT","IOTAUSDT","ROSEUSDT","RVNUSDT","ZILUSDT","IOSTUSDT","ONTUSDT","SKLUSDT","GLMRUSDT","BANDUSDT","CTSIUSDT","HOTUSDT","TRXUSDT","KAVAUSDT","ICXUSDT","STXUSDT","DENTUSDT","CVCUSDT","TWTUSDT","SXPUSDT","1INCHUSDT","ALICEUSDT","AUDIOUSDT","COTIUSDT","CTKUSDT","CHRUSDT","DARUSDT","DUSKUSDT","ELFUSDT","FRONTUSDT","GTCUSDT","HIFIUSDT","KEYUSDT","LINAUSDT","LPTUSDT","LTOUSDT","MBOXUSDT","MDTUSDT","MINAUSDT","NKNUSDT","OGNUSDT","PEOPLEUSDT","PONDUSDT","POWRUSDT","QUICKUSDT","RADUSDT","RAREUSDT","RNDRUSDT","SCUSDT","SLPUSDT","SPELLUSDT","STMXUSDT","SUNUSDT","SUPERUSDT","SYSUSDT","TKOUSDT","TLMUSDT","TOMOUSDT","TROYUSDT","TRUUSDT","TUSDUSDT","UMAUSDT","UNFIUSDT","VITEUSDT","WAXPUSDT","WINGUSDT","WNXMUSDT","WOOUSDT","XEMUSDT","XVSUSDT","YFIIUSDT","ZENUSDT","ZRXUSDT","ACHUSDT","AGIXUSDT","ALPHAUSDT","ARKUSDT","ASTRUSDT","ATAUSDT","ATMUSDT","AUTOUSDT","BAKEUSDT","BALUSDT","BETAUSDT","BICOUSDT","BLZUSDT","BNXUSDT","CELRUSDT","CFXUSDT","CLVUSDT","COCOSUSDT","COREUSDT","CKBUSDT","CITYUSDT","DEXEUSDT","DGBUSDT","DOCKUSDT","DREPUSDT","EDUUSDT","EPXUSDT","ERNUSDT","FIDAUSDT","FIOUSDT","FLMUSDT","FLOKIUSDT","FLOWUSDT","FORTHUSDT","FUNUSDT","FXSUSDT","GALUSDT","GHSTUSDT","GMXUSDT","GNSUSDT","HARDUSDT","HIGHUSDT","HIVEUSDT","IDEXUSDT","IDUSDT","ILVUSDT","INJUSDT","IOTXUSDT","JSTUSDT","KDAUSDT","KNCUSDT","KEEPUSDT","LEVERUSDT","LOKAUSDT","LQTYUSDT","LSKUSDT","LUNAUSDT","MAGICUSDT","MASKUSDT","MBLUSDT","MDXUSDT","MITHUSDT","MOVRUSDT","MULTIUSDT","NMRUSDT","NULSUSDT","OAXUSDT","OXTUSDT","PERPUSDT","PHBUSDT","PLAUSDT","POLSUSDT","PROMUSDT","PROSUSDT","PSGUSDT","PUNDIXUSDT","QKCUSDT","QSPUSDT","RAMPUSDT","REIUSDT","RIFUSDT","RLCUSDT","RSRUSDT","SANTOSUSDT","SCRTUSDT","SEIUSDT","SHIBUSDT","SNTUSDT","SOLOUSDT","SRMUSDT","STGUSDT","STPTUSDT","STRAXUSDT","SUSDUSDT","SWEATUSDT","TCTUSDT","TFUELUSDT","TIMEUSDT","TLOSUSDT","TRIBEUSDT","TVKUSDT","UFTUSDT","UNBUSDT","UOSUSDT","UTKUSDT","VAIUSDT","VELOUSDT","VIBUSDT","VIDTUSDT","VTHOUSDT","WANUSDT","WBTCUSDT","WINUSDT","WTCUSDT","XECUSDT","XNOUSDT","XVGUSDT","YGGUSDT"];
const bubblesContainer = document.getElementById('bubbles-container');
const lastUpdatedEl = document.getElementById('last-updated');
const searchInput = document.getElementById('search-input');
const paginationContainer = document.getElementById('pagination');
let coinsData = [], filteredCoins = [], currentPage = 1;
const coinsPerPage = 100;
function createBubble(coin) {
const b = document.createElement('div');
b.className = 'bubble ' + (coin.change > 0 ? 'up' : 'down');
const sym = coin.symbol.replace('USDT', '');
b.innerHTML = '<div class="coin-icon">' + sym.charAt(0) + '</div><div class="coin-symbol">' + sym + '</div><div class="coin-price">$' + parseFloat(coin.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 8 }) + '</div><div class="coin-change ' + (coin.change > 0 ? 'change-up' : 'change-down') + '">' + (coin.change > 0 ? '+' : '') + coin.change.toFixed(2) + '%</div>';
return b;
}
function renderCoins(coins, page) {
bubblesContainer.innerHTML = '';
if (!coins.length) { bubblesContainer.innerHTML = '<div class="loading"><div>لا توجد نتائج</div></div>'; return; }
const start = (page - 1) * coinsPerPage, end = start + coinsPerPage;
coins.slice(start, end).forEach(c => bubblesContainer.appendChild(createBubble(c)));
lastUpdatedEl.textContent = 'آخر تحديث: ' + new Date().toLocaleString('ar-EG');
updatePagination(coins.length, page);
}
function updatePagination(total, cur) {
const pages = Math.ceil(total / coinsPerPage);
paginationContainer.innerHTML = '';
for (let i = 1; i <= pages; i++) {
const b = document.createElement('button');
b.textContent = i;
if (i === cur) b.classList.add('active');
b.addEventListener('click', () => { currentPage = i; renderCoins(filteredCoins.length ? filteredCoins : coinsData, currentPage); });
paginationContainer.appendChild(b);
}
}
async function fetchCoinData() {
try {
const r = await fetch('https://api.binance.com/api/v3/ticker/24hr');
const d = await r.json();
coinsData = d.filter(i => coinSymbols.includes(i.symbol)).map(i => ({ symbol: i.symbol, price: i.lastPrice, change: parseFloat(i.priceChangePercent) })).sort((a, b) => b.change - a.change);
filteredCoins = [...coinsData];
renderCoins(coinsData, currentPage);
} catch (e) { bubblesContainer.innerHTML = '<div class="loading"><div>خطأ في التحميل</div></div>'; }
}
function filterCoins(term) {
if (!term) { filteredCoins = [...coinsData]; currentPage = 1; renderCoins(coinsData, 1); return; }
filteredCoins = coinsData.filter(c => c.symbol.replace('USDT', '').toLowerCase().includes(term.toLowerCase()));
currentPage = 1;
renderCoins(filteredCoins, 1);
}
fetchCoinData();
setInterval(fetchCoinData, 10000);
searchInput.addEventListener('input', e => filterCoins(e.target.value));
</script>

<body>
<div class="container">

<div class="logo"><div class="logo-text">Crypto Tracker</div></div>
<ul class="menu"><li class="menu-item active"><i class="fas fa-home"></i> الرئيسية</li></ul>
</div>
<div class="main-content">
<div class="main-header"><h1>سوق العملات الرقمية - الكريبتو</h1><p>تتبع أسعار العملات الرقمية لحظة بلحظة</p></div>
<div class="header">
<div class="search-box"><input type="text" id="search-input" placeholder="ابحث..."><i class="fas fa-search"></i></div>
<div class="market-info">
<div class="market-stat"><div class="value" id="total-market-cap">$--</div><div class="label">القيمة السوقية</div></div>
<div class="market-stat"><div class="value" id="total-volume">$--</div><div class="label">حجم التداول</div></div>
<div class="market-stat"><div class="value" id="btc-dominance">--%</div><div class="label">هيمنة BTC</div></div>
</div>
</div>
<div class="markets-section">
<div class="section-header">
<div class="section-title">أسعار العملات - <span id="current-date"></span></div>
<div class="tabs"><div class="tab active" data-type="all">الكل</div><div class="tab" data-type="top-traded">الأكثر تداولاً</div></div>
</div>
<div class="sub-tabs">
<div class="sub-tab active" data-pair="USDT">USDT</div>
<div class="sub-tab" data-pair="BTC">BTC</div>
<div class="sub-tab" data-pair="BNB">BNB</div>
<div class="sub-tab" data-pair="ETH">ETH</div>
</div>
<div class="markets-table">
<div class="table-header"><div>الاسم</div><div>السعر</div><div>التغير 24س</div><div>الحجم 24س</div><div>القيمة السوقية</div></div>
<div id="coins-container"><div class="loading"><i class="fas fa-spinner fa-spin"></i> جلب البيانات...</div></div>
</div>
<div class="chart-container" id="chart-container">
<div class="close-chart" id="close-chart"><i class="fas fa-times"></i></div>
<div class="chart-header">
<div class="chart-title"><span id="chart-coin-name">-</span><span class="price-info" id="chart-price">$--</span><span class="change" id="chart-change">--%</span></div>
<div class="time-intervals">
<div class="interval" data-interval="1h">1H</div>
<div class="interval" data-interval="1d">1D</div>
<div class="interval active" data-interval="1w">1W</div>
<div class="interval" data-interval="1m">1M</div>
</div>
</div>
<div id="chart"></div>
</div>
</div>
</div>
</div>
<script>
const now = new Date();
document.getElementById('current-date').textContent = now.toLocaleDateString('ar-EG');
const coinContainer = document.getElementById('coins-container');
const chartContainer = document.getElementById('chart-container');
const closeChart = document.getElementById('close-chart');
const chartTitle = document.getElementById('chart-coin-name');
const chartPrice = document.getElementById('chart-price');
const chartChange = document.getElementById('chart-change');
const chartElement = document.getElementById('chart');
const searchInput = document.getElementById('search-input');
let allCoins = [], filteredCoins = [], currentPair = 'USDT', currentChartSymbol = '', chart = null, candleSeries = null;
async function fetchMarketData() {
try {
const r = await fetch('https://api.binance.com/api/v3/ticker/24hr');
const d = await r.json();
allCoins = d.filter(i => i.symbol.endsWith(currentPair)).sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume));
filteredCoins = allCoins;
displayCoins(allCoins);
const totalVol = allCoins.reduce((s, c) => s + parseFloat(c.quoteVolume), 0);
document.getElementById('total-volume').textContent = '$' + (totalVol / 1e9).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'B';
document.getElementById('total-market-cap').textContent = '$' + (totalVol * 20 / 1e12).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'T';
document.getElementById('btc-dominance').textContent = (38 + Math.random() * 2).toFixed(1) + '%';
} catch (e) { coinContainer.innerHTML = '<div class="loading">خطأ</div>'; }
}
function displayCoins(coins) {
if (!coins.length) { coinContainer.innerHTML = '<div class="loading">لا توجد نتائج</div>'; return; }
coinContainer.innerHTML = '';
coins.forEach(c => {
const sym = c.symbol.replace(currentPair, '');
const price = parseFloat(c.lastPrice);
const change = parseFloat(c.priceChangePercent);
const vol = parseFloat(c.quoteVolume);
const row = document.createElement('div');
row.className = 'coin-row';
row.innerHTML = '<div class="coin-info"><div class="coin-icon">' + sym.substring(0, 2) + '</div><div><div style="font-weight:bold">' + sym + '</div><span style="color:#b7bdc6;font-size:14px">/' + currentPair + '</span></div></div><div class="price">$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: price < 1 ? 6 : 2 }) + '</div><div class="change ' + (change >= 0 ? 'positive' : 'negative') + '">' + (change >= 0 ? '+' : '') + change.toFixed(2) + '%</div><div class="volume">$' + (vol / 1e6).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'M</div><div class="market-cap">--</div>';
row.addEventListener('click', () => showChart(c.symbol, sym, price, change));
coinContainer.appendChild(row);
});
}
searchInput.addEventListener('input', () => {
const t = searchInput.value.toLowerCase();
filteredCoins = t === '' ? allCoins : allCoins.filter(c => c.symbol.replace(currentPair, '').toLowerCase().includes(t));
displayCoins(filteredCoins);
});
document.querySelectorAll('.tab').forEach(tab => {
tab.addEventListener('click', () => {
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
tab.classList.add('active');
if (tab.dataset.type === 'top-traded') {
const top = [...allCoins].sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 20);
displayCoins(top);
} else displayCoins(allCoins);
});
});
document.querySelectorAll('.sub-tab').forEach(tab => {
tab.addEventListener('click', () => {
document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
tab.classList.add('active');
currentPair = tab.dataset.pair;
fetchMarketData();
});
});
async function showChart(symbol, name, price, change) {
currentChartSymbol = symbol;
chartTitle.textContent = name + '/' + currentPair;
chartPrice.textContent = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: price < 1 ? 6 : 2 });
chartChange.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
chartChange.className = 'change ' + (change >= 0 ? 'positive' : 'negative');
chartContainer.style.display = 'block';
if (!chart) {
chart = LightweightCharts.createChart(chartElement, { width: chartElement.clientWidth, height: 400, layout: { backgroundColor: '#2b3139', textColor: '#d9d9d9' } });
candleSeries = chart.addCandlestickSeries({ upColor: '#0ecb81', downColor: '#f6465d', borderDownColor: '#f6465d', borderUpColor: '#0ecb81', wickDownColor: '#f6465d', wickUpColor: '#0ecb81' });
}
try {
const r = await fetch('https://api.binance.com/api/v3/klines?symbol=' + symbol + '&interval=1w&limit=100');
const d = await r.json();
const data = d.map(x => ({ time: x[0] / 1000, open: parseFloat(x[1]), high: parseFloat(x[2]), low: parseFloat(x[3]), close: parseFloat(x[4]) }));
candleSeries.setData(data);
chart.timeScale().fitContent();
} catch (e) { console.error(e); }
chartContainer.scrollIntoView({ behavior: 'smooth' });
}
document.querySelectorAll('.interval').forEach(i => {
i.addEventListener('click', async () => {
document.querySelectorAll('.interval').forEach(x => x.classList.remove('active'));
i.classList.add('active');
if (!currentChartSymbol) return;
let bi = '1w';
if (i.dataset.interval === '1h') bi = '1h';
else if (i.dataset.interval === '1d') bi = '1d';
else if (i.dataset.interval === '1m') bi = '1M';
try {
const r = await fetch('https://api.binance.com/api/v3/klines?symbol=' + currentChartSymbol + '&interval=' + bi + '&limit=100');
const d = await r.json();
candleSeries.setData(d.map(x => ({ time: x[0] / 1000, open: parseFloat(x[1]), high: parseFloat(x[2]), low: parseFloat(x[3]), close: parseFloat(x[4]) })));
} catch (e) {}
});
});
closeChart.addEventListener('click', () => { chartContainer.style.display = 'none'; });
window.addEventListener('resize', () => { if (chart) chart.applyOptions({ width: chartElement.clientWidth }); });
fetchMarketData();
setInterval(fetchMarketData, 10000);
</script>
</body>
</html>
</template>

<script>
(function() {
'use strict';
const YOUTUBE_API_KEY = 'AIzaSyCV15Vidv5pZTBdAXwRXQtSAPE8kgRKTpg';
const videoUrlInput = document.getElementById('videoUrl');
const analyzeBtn = document.getElementById('analyzeBtn');
const loadingSection = document.getElementById('loadingSection');
const resultsSection = document.getElementById('resultsSection');
const errorSection = document.getElementById('errorSection');
const errorMessage = document.getElementById('errorMessage');
const progressBar = document.getElementById('progressBar');
const loadingText = document.getElementById('loadingText');
const totalCommentsEl = document.getElementById('totalComments');
const winnerNameEl = document.getElementById('winnerName');
const winnerCommentEl = document.getElementById('winnerComment');
const winnerAvatar = document.getElementById('winnerAvatar');
const newDrawBtn = document.getElementById('newDrawBtn');
const saveCardBtn = document.getElementById('saveCardBtn');
const newVideoBtn = document.getElementById('newVideoBtn');
const backBtn = document.getElementById('backBtn');
const toast = document.getElementById('toast');
const countdownContainer = document.getElementById('countdownContainer');
const countdownNumber = document.getElementById('countdownNumber');
const topCommenterBtn = document.getElementById('topCommenterBtn');
const winnerCommentCount = document.getElementById('winnerCommentCount');
const commentCountValue = document.getElementById('commentCountValue');
const filterBeforeBtn = document.getElementById('filterBeforeBtn');
const filterBeforeInput = document.getElementById('filterBeforeInput');
let originalCommentsList = [], commentsList = [], countdownInterval = null, isFetching = false;
let filterBeforeEnabled = false, filterBeforeText = '', topCommenterMode = false, totalCommentCount = 0;
function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }
function extractVideoId(url) {
const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?#]+)/);
return m ? m[1] : null;
}
async function fetchVideoCommentCount(videoId) {
try {
const r = await fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics&id=' + videoId + '&key=' + YOUTUBE_API_KEY);
const d = await r.json();
if (d.items && d.items.length > 0) return parseInt(d.items[0].statistics.commentCount) || 0;
return 0;
} catch (e) { return 0; }
}
async function fetchYouTubeComments(videoId) {
let all = [], next = '', pages = 0;
try {
totalCommentCount = await fetchVideoCommentCount(videoId);
do {
const url = 'https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=' + videoId + '&key=' + YOUTUBE_API_KEY + '&maxResults=100&pageToken=' + next;
const r = await fetch(url);
const d = await r.json();
if (d.error) throw new Error(d.error.message);
if (!d.items || !d.items.length) break;
d.items.forEach(item => {
const s = item.snippet.topLevelComment.snippet;
all.push({ name: s.authorDisplayName, comment: s.textDisplay, avatar: s.authorProfileImageUrl });
});
pages++;
progressBar.style.width = Math.min(pages * 10, 90) + '%';
next = d.nextPageToken || '';
} while (next);
progressBar.style.width = '100%';
if (totalCommentCount === 0) totalCommentCount = all.length;
return all;
} catch (e) { throw e; }
}
function applyFilterBefore() {
if (!filterBeforeEnabled || !filterBeforeText.trim()) commentsList = [...originalCommentsList];
else commentsList = originalCommentsList.filter(c => c.comment && c.comment.toLowerCase().includes(filterBeforeText.trim().toLowerCase()));
totalCommentsEl.textContent = filterBeforeEnabled && filterBeforeText.trim() ? commentsList.length : totalCommentCount;
}
function pickWinner() {
if (!commentsList.length) return null;
if (topCommenterMode) {
const map = new Map();
commentsList.forEach(c => { const n = c.name || 'مجهول'; map.set(n, (map.get(n) || 0) + 1); });
let max = 0, name = '';
for (const [n, c] of map.entries()) { if (c > max) { max = c; name = n; } }
const w = commentsList.find(c => (c.name || 'مجهول') === name);
return { name, comment: w ? w.comment : '', avatar: w ? w.avatar : '', count: max };
} else {
const w = commentsList[Math.floor(Math.random() * commentsList.length)];
return { name: w.name || 'بدون اسم', comment: w.comment || '', avatar: w.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(w.name || 'فائز') + '&background=F0B90B&color=0B0E11&size=128', count: null };
}
}
function startCountdown() {
document.getElementById('winnerCard').style.display = 'none';
countdownContainer.style.display = 'block';
countdownNumber.textContent = '5';
let s = 5;
countdownInterval = setInterval(() => {
s--;
countdownNumber.textContent = s;
if (s <= 0) {
clearInterval(countdownInterval);
countdownContainer.style.display = 'none';
const w = pickWinner();
if (w) {
winnerNameEl.textContent = w.name;
winnerCommentEl.textContent = w.comment;
winnerAvatar.src = w.avatar;
if (w.count !== null && topCommenterMode) { commentCountValue.textContent = w.count; winnerCommentCount.style.display = 'inline-flex'; }
else winnerCommentCount.style.display = 'none';
if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
}
document.getElementById('winnerCard').style.display = 'block';
analyzeBtn.disabled = false;
isFetching = false;
}
}, 1000);
}
async function onAnalyzeClick() {
if (isFetching) return;
const url = videoUrlInput.value.trim();
if (!url) { errorMessage.textContent = 'أدخل رابط'; errorSection.classList.add('active'); return; }
const vid = extractVideoId(url);
if (!vid) { errorMessage.textContent = 'رابط غير صالح'; errorSection.classList.add('active'); return; }
analyzeBtn.disabled = true;
isFetching = true;
errorSection.classList.remove('active');
loadingSection.classList.add('active');
progressBar.style.width = '0%';
try {
originalCommentsList = await fetchYouTubeComments(vid);
applyFilterBefore();
loadingSection.classList.remove('active');
resultsSection.classList.add('active');
startCountdown();
} catch (e) {
analyzeBtn.disabled = false;
isFetching = false;
loadingSection.classList.remove('active');
errorMessage.textContent = e.message || 'فشل التحميل';
errorSection.classList.add('active');
}
}
function onNewDrawClick() {
if (countdownInterval) clearInterval(countdownInterval);
if (!commentsList.length) { showToast('لا توجد تعليقات'); return; }
startCountdown();
}
function onNewVideoClick() {
if (countdownInterval) clearInterval(countdownInterval);
resultsSection.classList.remove('active');
videoUrlInput.value = '';
analyzeBtn.disabled = false;
isFetching = false;
originalCommentsList = [];
commentsList = [];
}
function onFilterBeforeClick() {
filterBeforeEnabled = !filterBeforeEnabled;
if (filterBeforeEnabled) { filterBeforeBtn.classList.add('active'); filterBeforeInput.style.display = 'block'; filterBeforeText = filterBeforeInput.value; }
else { filterBeforeBtn.classList.remove('active'); filterBeforeInput.style.display = 'none'; filterBeforeText = ''; }
if (originalCommentsList.length) applyFilterBefore();
}
function onTopCommenterClick() {
topCommenterMode = !topCommenterMode;
topCommenterBtn.classList.toggle('active', topCommenterMode);
}
async function onSaveCardClick() {
const card = document.getElementById('winnerCard');
try {
const canvas = await html2canvas(card, { scale: 1.5, backgroundColor: '#181a20', useCORS: true });
const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
if (navigator.canShare && navigator.share) {
const file = new File([blob], 'winner.png', { type: 'image/png' });
if (navigator.canShare({ files: [file] })) {
try { await navigator.share({ files: [file] }); return; } catch (e) {}
}
}
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = 'winner.png';
document.body.appendChild(a); a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
showToast('تم التحميل');
} catch (e) { showToast('فشل الحفظ'); }
}
analyzeBtn.addEventListener('click', onAnalyzeClick);
newDrawBtn.addEventListener('click', onNewDrawClick);
newVideoBtn.addEventListener('click', onNewVideoClick);
filterBeforeBtn.addEventListener('click', onFilterBeforeClick);
filterBeforeInput.addEventListener('input', function() { filterBeforeText = this.value; if (originalCommentsList.length) applyFilterBefore(); });
topCommenterBtn.addEventListener('click', onTopCommenterClick);
saveCardBtn.addEventListener('click', onSaveCardClick);
backBtn.addEventListener('click', () => { errorSection.classList.remove('active'); analyzeBtn.disabled = false; isFetching = false; });
})();
</script>
</body>

<script>
(function() {
  'use strict';
  const frame = document.getElementById('app-frame');
  
  const pages = {
    'index': 'page-home',
    'home': 'page-home',
    'recommendations': 'page-recommendations',
    'word-of-day': 'page-word-of-day',
    'word-details': 'page-word-details',
    'subscribe-now': 'page-subscribe-now',
    'subscribe-word': 'page-subscribe-word',
    'learn-trading': 'page-learn-trading',
    'trading-course': 'page-trading-course',
    'trading-signals-details': 'page-trading-signals-details',
    'crypto-bubble': 'page-crypto-bubble',
    'currency-market': 'page-currency-market',
    'winner-pick': 'page-winner-pick'
  };

  function loadPage(name) {
    if (!name) name = 'index';
    const templateId = pages[name] || pages['index'];
    const tpl = document.getElementById(templateId);
    if (!tpl) { console.error('Template not found:', templateId); return; }
    const html = tpl.innerHTML;
    frame.setAttribute('data-current', name);
    frame.srcdoc = html;
  }

  function hookFrame() {
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.addEventListener('click', function(e) {
        let el = e.target;
        while (el && el !== doc.body && el.nodeType === 1) {
          if (el.tagName === 'A') {
            const href = el.getAttribute('href');
            if (!href) break;
            if (/^https?:\/\//i.test(href)) break;
            if (/^(#|mailto:|tel:|javascript:)/i.test(href)) break;
            if (href.endsWith('.html') || href === '' || href === './' || href === '/') {
              e.preventDefault();
              e.stopPropagation();
              let pageName = href.replace(/^\.\//, '').replace(/\.html$/i, '').replace(/^\//, '').replace(/\/$/, '');
              if (!pageName || pageName === 'index') pageName = 'index';
              if (!pages[pageName]) pageName = 'index';
              location.hash = pageName;
              return;
            }
            break;
          }
          el = el.parentElement;
        }
      }, true);
    } catch (err) { console.warn(err); }
  }

  frame.addEventListener('load', hookFrame);
  window.addEventListener('hashchange', function() { loadPage(location.hash.slice(1)); });
  loadPage(location.hash.slice(1) || 'index');
})();
</script>
