<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>كريم العالمي - صالون الحلاقة</title>
    <link rel="manifest" href="data:application/json,{}" id="manifest-placeholder" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== متغيرات الثيم ===== */
        :root {
            --bg-primary: #181a20;
            --bg-secondary: #1e2329;
            --bg-card: #2b313a;
            --gold: #fcd535;
            --gold-dark: #f0b90b;
            --text-primary: #ffffff;
            --text-secondary: #a0a8b3;
            --border-color: #3b424d;
            --shadow: 0 12px 40px rgba(0,0,0,0.8);
            --radius: 20px;
            --nav-height: 72px;
            --header-height: 64px;
            --transition: 0.3s ease;
        }
        body.light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e8e8e8;
            --bg-card: #ffffff;
            --text-primary: #222;
            --text-secondary: #555;
            --border-color: #ccc;
            --shadow: 0 12px 40px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
            direction: rtl;
            transition: background var(--transition), color var(--transition);
        }
        body.ltr { direction: ltr; }
        body.ltr .app-container { direction: ltr; }
        body.ltr .card-gold { border-right: none; border-left: 5px solid var(--gold); }

        .app-container {
            max-width: 430px;
            width: 100%;
            background: var(--bg-primary);
            border-radius: 32px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            height: 820px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border var(--transition);
        }
        /* الهيدر */
        .app-header {
            background: var(--bg-secondary);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            height: var(--header-height);
            transition: background var(--transition);
        }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand i { font-size: 26px; color: var(--gold); }
        .brand-name {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .brand-sub { font-size: 10px; color: var(--text-secondary); display: block; -webkit-text-fill-color: var(--text-secondary); background: none; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-btn {
            background: var(--bg-primary); border: 1px solid var(--border-color);
            color: var(--text-secondary); width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 16px;
        }
        .header-btn:hover { border-color: var(--gold); color: var(--gold); }
        .user-badge {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-primary); padding: 2px 12px 2px 8px;
            border-radius: 30px; border: 1px solid var(--border-color);
            cursor: pointer; transition: 0.2s; font-size: 12px; color: var(--text-secondary);
        }
        .user-badge:hover { border-color: var(--gold); }
        .user-badge i { font-size: 20px; color: var(--gold); }

        .main-content { flex: 1; overflow-y: auto; padding: 14px 14px 8px; scroll-behavior: smooth; }
        .main-content::-webkit-scrollbar { width: 4px; }
        .main-content::-webkit-scrollbar-track { background: var(--bg-primary); }
        .main-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .page { display: none; animation: fadeUp 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }

        /* بطاقات محسنة */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border var(--transition), transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card-gold { border-right: 5px solid var(--gold); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: var(--gold); }

        /* خدمة محسنة */
        .service-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border-color);
            transition: 0.2s;
        }
        .service-item:last-child { border-bottom: none; }
        .service-item:hover { background: rgba(252,213,53,0.03); border-radius: 10px; padding-left: 8px; padding-right: 8px; }
        .service-info { display: flex; align-items: center; gap: 12px; }
        .service-icon {
            width: 44px; height: 44px;
            background: rgba(252,213,53,0.12);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--gold); font-size: 20px;
        }
        .service-name { font-weight: 600; font-size: 16px; }
        .service-price {
            color: var(--gold); font-weight: 800; font-size: 22px;
            background: rgba(252,213,53,0.08);
            padding: 2px 16px; border-radius: 30px;
            border: 1px solid rgba(252,213,53,0.2);
        }
        .service-actions { display: flex; gap: 10px; align-items: center; }
        .btn-order {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            border: none; padding: 8px 20px; border-radius: 30px;
            font-weight: 700; font-size: 14px; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 15px rgba(252,213,53,0.3);
        }
        .btn-order:hover { transform: scale(1.08); box-shadow: 0 6px 25px rgba(252,213,53,0.5); }

        /* عروض العريس */
        .offer-card {
            background: linear-gradient(145deg, #2b313a, #1e2329);
            border: 2px solid var(--gold);
            border-radius: var(--radius);
            padding: 18px; margin-bottom: 14px;
            position: relative; overflow: hidden;
            transition: all 0.3s;
        }
        .offer-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(252,213,53,0.25); }
        .offer-card::before { content: '👑'; position: absolute; top: -8px; left: -8px; font-size: 60px; opacity: 0.1; transform: rotate(-15deg); }
        .offer-title { font-size: 20px; font-weight: 700; color: var(--gold); }
        .offer-price { font-size: 26px; font-weight: 800; color: #fff; }
        .offer-desc { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
        .offer-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .offer-details-btn {
            background: transparent; border: 2px solid var(--gold);
            color: var(--gold); padding: 6px 18px; border-radius: 30px;
            cursor: pointer; transition: 0.3s; font-weight: 600;
        }
        .offer-details-btn:hover { background: var(--gold); color: var(--bg-primary); }
        .offer-order-btn {
            background: var(--gold); border: none;
            color: var(--bg-primary); padding: 6px 18px; border-radius: 30px;
            cursor: pointer; transition: 0.3s; font-weight: 700;
        }
        .offer-order-btn:hover { background: var(--gold-dark); transform: scale(1.05); }

        /* الحجوزات */
        .booking-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .booking-table th { background: var(--gold); color: var(--bg-primary); padding: 8px; text-align: center; }
        .booking-table td { padding: 8px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .booking-table tr:hover { background: rgba(252,213,53,0.05); }
        .phone-masked { font-family: monospace; letter-spacing: 2px; }

        /* الملف الشخصي */
        .profile-avatar {
            width: 90px; height: 90px; background: var(--gold);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 44px; color: var(--bg-primary); margin: 0 auto 14px;
            border: 4px solid var(--gold-dark);
        }
        .profile-name { font-size: 22px; font-weight: 700; text-align: center; }
        .profile-email { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }

        .admin-panel {
            background: var(--bg-secondary); border: 1px solid var(--gold);
            border-radius: var(--radius); padding: 16px; margin-top: 10px;
        }
        .admin-service-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-color);
        }
        .admin-service-item:last-child { border-bottom: none; }
        .admin-actions { display: flex; gap: 6px; }
        .btn-sm { padding: 4px 14px; font-size: 12px; border-radius: 30px; }

        .btn {
            padding: 12px 20px; border: none; border-radius: 14px;
            font-weight: 700; font-size: 15px; cursor: pointer;
            transition: all 0.25s; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
            width: 100%;
        }
        .btn-gold { background: var(--gold); color: var(--bg-primary); }
        .btn-gold:hover { background: var(--gold-dark); transform: scale(1.02); box-shadow: 0 8px 20px rgba(252,213,53,0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--gold); color: var(--gold); }
        .btn-outline:hover { background: var(--gold); color: var(--bg-primary); }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 6px 16px; font-size: 13px; width: auto; }

        .toast {
            background: var(--gold); color: var(--bg-primary);
            padding: 12px 16px; border-radius: 14px; font-weight: 600;
            font-size: 14px; display: none; align-items: center; gap: 10px;
            margin-top: 12px;
        }
        .toast.show { display: flex; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-primary); font-size: 15px;
            outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold); box-shadow: 0 0 0 4px rgba(252,213,53,0.15);
        }
        .form-group .error-msg { color: #e74c3c; font-size: 12px; margin-top: 4px; display: none; }

        .bottom-nav {
            background: var(--bg-secondary); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around;
            padding: 4px 0 6px; flex-shrink: 0; height: var(--nav-height);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: var(--text-secondary); font-size: 11px; cursor: pointer;
            transition: 0.2s; padding: 4px 10px; border-radius: 12px;
            background: transparent; border: none; font-family: inherit;
            min-width: 50px;
        }
        .nav-item i { font-size: 22px; transition: 0.2s; }
        .nav-item.active { color: var(--gold); }
        .nav-item.active i { transform: translateY(-2px); text-shadow: 0 0 12px rgba(252,213,53,0.3); }
        .nav-item:hover { color: var(--gold); }

        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-secondary); max-width: 380px; width: 90%;
            border-radius: var(--radius); padding: 24px; border: 1px solid var(--gold);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-box h3 { color: var(--gold); margin-bottom: 12px; }
        .modal-box ul { list-style: none; padding: 0; }
        .modal-box ul li { padding: 8px 0; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        .modal-box ul li i { color: var(--gold); width: 20px; }
        .modal-close { margin-top: 16px; }

        .text-muted { color: var(--text-secondary); }
        .text-gold { color: var(--gold); }
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-10 { gap: 10px; }

        .install-btn {
            background: var(--gold); color: var(--bg-primary);
            border: none; padding: 6px 16px; border-radius: 30px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: 0.2s;
        }
        .install-btn:hover { background: var(--gold-dark); transform: scale(1.05); }

        @media (max-width:460px) {
            .app-container { height: 100vh; border-radius: 0; max-width:100%; }
            .brand-name { font-size: 18px; }
            .service-price { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- الهيدر -->
    <header class="app-header">
        <div class="brand">
            <i class="fas fa-scissors"></i>
            <div>
                <span class="brand-name" data-i18n="app_name">كريم العالمي</span>
                <span class="brand-sub" data-i18n="app_sub">صالون الحلاقة</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="themeToggle" title="الوضع الليلي/النهاري"><i class="fas fa-moon"></i></button>
            <button class="install-btn" id="installAppBtn"><i class="fas fa-download"></i> <span data-i18n="install">تثبيت</span></button>
            <div class="user-badge" id="userBadge" title="الملف الشخصي">
                <i class="fas fa-user-circle"></i>
                <span id="userBadgeName" data-i18n="guest">زائر</span>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="main-content" id="mainContent">

        <!-- ===== الصفحة الرئيسية ===== -->
        <section class="page active" id="page-home">
            <div class="card card-gold">
                <div class="flex-between">
                    <div><h2 style="font-size:22px;" data-i18n="welcome">مرحباً بك 👋</h2><p class="text-muted" style="font-size:14px;" data-i18n="welcome_sub">اختر خدمتك واضغط "طلب"</p></div>
                    <i class="fas fa-crown" style="font-size:38px; color:var(--gold);"></i>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-list"></i> <span data-i18n="services_title">خدماتنا</span></span>
                    <span class="text-muted" style="font-size:13px;" data-i18n="instant_order">طلب فوري</span>
                </div>
                <div class="service-grid" id="serviceList"></div>
            </div>
        </section>

        <!-- ===== صفحة العريس ===== -->
        <section class="page" id="page-offers">
            <div class="card card-gold">
                <div class="card-title"><i class="fas fa-ring"></i> <span data-i18n="groom_title">عروض العريس المميزة</span></div>
                <div id="offersContainer"></div>
            </div>
        </section>

        <!-- ===== صفحة الحجوزات ===== -->
        <section class="page" id="page-bookings">
            <div class="card">
                <div class="card-title"><i class="fas fa-history"></i> <span data-i18n="bookings_title">سجل الحجوزات</span></div>
                <div id="bookingsList">
                    <p class="text-muted text-center" data-i18n="no_bookings">لا توجد حجوزات حتى الآن</p>
                </div>
            </div>
        </section>

        <!-- ===== صفحة الملف الشخصي ===== -->
        <section class="page" id="page-profile">
            <div class="card text-center">
                <div class="profile-avatar" id="profileAvatar"><i class="fas fa-user"></i></div>
                <div class="profile-name" id="profileName" data-i18n="guest">زائر</div>
                <div class="profile-email" id="profileEmail" data-i18n="not_registered">غير مسجل</div>
                <div class="profile-phone" id="profilePhone" style="text-align:center;color:var(--text-secondary);font-size:14px;"></div>
                <div style="display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" id="loginBtn"><i class="fas fa-sign-in-alt"></i> <span data-i18n="login">تسجيل دخول</span></button>
                    <button class="btn btn-outline btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span data-i18n="logout">خروج</span></button>
                    <button class="btn btn-outline btn-sm" id="langToggle"><i class="fas fa-globe"></i> <span data-i18n="lang_switch">English</span></button>
                </div>
            </div>
            <!-- لوحة الأدمن -->
            <div id="adminPanel" class="admin-panel hidden">
                <div class="card-title"><i class="fas fa-cog"></i> <span data-i18n="admin_panel">لوحة التحكم (أدمن)</span></div>
                <div id="adminServiceList"></div>
                <div id="adminOfferList" style="margin-top:16px;border-top:1px solid var(--border-color);padding-top:12px;">
                    <div class="card-title" style="font-size:16px;"><i class="fas fa-ring"></i> <span data-i18n="admin_offers">عروض العريس</span></div>
                    <div id="adminOffersContainer"></div>
                </div>
                <hr style="border-color:var(--border-color); margin:16px 0;" />
                <div class="form-group"><label data-i18n="new_service_name">اسم الخدمة الجديدة</label><input type="text" id="newServiceName" placeholder="مثل: حلاقة مميزة" /></div>
                <div class="form-group"><label data-i18n="new_service_price">السعر (جنيه)</label><input type="number" id="newServicePrice" placeholder="مثل: 60" /></div>
                <button class="btn btn-gold btn-sm" id="addServiceBtn"><i class="fas fa-plus"></i> <span data-i18n="add_service">إضافة خدمة</span></button>
                <hr style="border-color:var(--border-color); margin:16px 0;" />
                <div class="form-group"><label data-i18n="new_offer_name">اسم عرض العريس الجديد</label><input type="text" id="newOfferName" placeholder="مثل: حلقة العريس الفاخرة" /></div>
                <div class="form-group"><label data-i18n="new_offer_price">سعر العرض (جنيه)</label><input type="number" id="newOfferPrice" placeholder="مثل: 600" /></div>
                <div class="form-group"><label data-i18n="offer_details">تفاصيل العرض (افصل بينها بفاصلة)</label><input type="text" id="newOfferDetails" placeholder="مثل: حلق شعر, مساج, ماسك" /></div>
                <button class="btn btn-gold btn-sm" id="addOfferBtn"><i class="fas fa-plus"></i> <span data-i18n="add_offer">إضافة عرض</span></button>
                <p class="text-muted mt-8" style="font-size:12px;" data-i18n="admin_note">* التعديلات تحفظ محلياً وتظهر فوراً</p>
            </div>
        </section>

    </main>

    <!-- التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="page-home"><i class="fas fa-home"></i><span data-i18n="nav_home">الرئيسية</span></button>
        <button class="nav-item" data-page="page-offers"><i class="fas fa-gem"></i><span data-i18n="nav_groom">العريس</span></button>
        <button class="nav-item" data-page="page-bookings"><i class="fas fa-calendar-check"></i><span data-i18n="nav_bookings">الحجوزات</span></button>
        <button class="nav-item" data-page="page-profile"><i class="fas fa-user"></i><span data-i18n="nav_profile">الملف</span></button>
    </nav>
</div>

<!-- مودال التفاصيل -->
<div class="modal-overlay" id="offerModal">
    <div class="modal-box">
        <h3 id="modalTitle">تفاصيل العرض</h3>
        <ul id="modalDetails"></ul>
        <button class="btn btn-gold modal-close" id="modalCloseBtn"><span data-i18n="close">إغلاق</span></button>
    </div>
</div>

<script>
    // ====================================================================
    //  1. البيانات الأساسية
    // ====================================================================
    const DEFAULT_SERVICES = [
        { name: 'حلقة أطفال', price: 20 },
        { name: 'الشبّة', price: 40 },
        { name: 'حلقة الرجل', price: 50 },
        { name: 'حلق الرأس فقط', price: 30 },
        { name: 'حلق الدقن', price: 30 },
        { name: 'حلق رأس ودقن', price: 50 },
        { name: 'فوطة سخنة', price: 30 }
    ];

    const DEFAULT_OFFERS = [
        {
            name: '💍 حلقة العريس (حنة)',
            price: 300,
            details: ['حلق شعر الرأس', 'حلق الدقن', 'مساج للبشرة', 'ماسك لتفتيح البشرة', 'بخار ساخن وبارد', 'علاج للشعر']
        },
        {

    // ====================================================================

    function isValidName(name) {
        return /^[\u0600-\u06FFa-zA-Z\s]{2,}$/.test(name.trim());
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    }

    function isValidPhone(phone) {
        return /^(010|011|012|015)\d{8}$/.test(phone.trim());
    }

    function maskPhone(phone, isAdmin) {
        if (isAdmin) return phone;
        if (!phone || phone.length < 11) return phone;
        const first = phone.slice(0, 3);
        const last = phone.slice(-3);
        return first + '•••••' + last;
    }

    function requestService(item, type) {
        if (!currentUser) {
            alert(t('order_fail'));
            navigateTo('page-profile');
            return;
        }
        const name = currentUser.name || 'عميل';
        const phone = currentUser.phone || 'غير مسجل';
        const now = new Date();
        const time = now.toLocaleString('ar-EG', { hour12: true });
        const itemName = item.name;
        const price = item.price;
        const typeLabel = type === 'offer' ? 'عرض عريس' : 'خدمة';

        const booking = { name, phone, service: itemName + ' (' + typeLabel + ')', time, price };
        bookings.push(booking);
        saveBookings(bookings);

        const ownerPhone = "201154846407";
        const message = `📢 *طلب ${typeLabel} من كريم العالمي*%0A🧑 العميل: ${name}%0A📞 الهاتف: ${phone}%0A✂️ ${typeLabel}: ${itemName}%0A💰 السعر: ${price} ج.م%0A🕒 الوقت: ${time}`;
        const waLink = `https://wa.me/${ownerPhone}?text=${message}`;
        window.open(waLink, '_blank');

        alert(`✅ ${t('order_sent')}`);
        renderBookings();
    }

    function showLoginDialog() {
        const name = prompt('أدخل اسمك الكامل (حروف فقط):', currentUser ? currentUser.name : '');
        if (name === null) return;
        if (!isValidName(name)) {
            alert(t('name_invalid'));
            return;
        }

        const email = prompt('أدخل بريدك الإلكتروني:', currentUser ? currentUser.email : '');
        if (email === null) return;
        if (!isValidEmail(email)) {
            alert(t('email_invalid'));
            return;
        }

        const phone = prompt('أدخل رقم هاتفك (11 رقماً يبدأ بـ 010/011/012/015):', currentUser ? currentUser.phone : '');
        if (phone === null) return;
        if (!isValidPhone(phone)) {
            alert(t('phone_invalid'));
            return;
        }

        currentUser = { name: name.trim(), email: email.trim(), phone: phone.trim() };
        saveUser(currentUser);
        renderAll();
        if (currentUser.email === ADMIN_EMAIL) {
            alert('✅ مرحباً أيها الأدمن! لوحة التحكم متاحة.');
        } else {
            alert('✅ ' + t('login_success'));
        }
        navigateTo('page-profile');
    }

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                alert('✅ تم تثبيت التطبيق بنجاح');
            } else {
                alert('❌ تم إلغاء التثبيت');
            }
            deferredPrompt = null;
            installBtn.style.display = 'none';
        } else {
            alert('يمكنك تثبيت التطبيق من قائمة المتصفح (إضافة إلى الشاشة الرئيسية)');
        }
    });

    // إنشاء Service Worker ديناميكي للتثبيت
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
            self.addEventListener('install', e => e.waitUntil(skipWaiting()));
            self.addEventListener('activate', e => e.waitUntil(clients.claim()));
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `)).then(() => {
            console.log('SW registered');
        }).catch(() => {});
    }

    // ====================================================================
    //  16. التحديث الشامل والتهيئة
    // ====================================================================
    function renderAll() {
        renderServices();
        renderOffers();
        renderBookings();
        renderAdminPanel();
        updateProfileUI();
    }

    document.addEventListener('DOMContentLoaded', function() {
        applyTheme(currentTheme);
        applyLanguage(currentLang);
        renderAll();
        navigateTo('page-home');
        console.log('✅ تطبيق كريم العالمي - النسخة النهائية جاهزة');
    });
</script>
</body>
</html>
