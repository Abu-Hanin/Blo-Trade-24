</style>

<script>
/* ================== الإعدادات ================== */
const TG_TOKEN='8848036284:AAGVbG_UylFYsYagJM56Fg_kIqaDdiT9AuM';
const TG_CHAT='6242313550';
const TG_API='https://api.telegram.org/bot'+TG_TOKEN;
const ADM_E='swlyd3393@gmail.com';

const PRICE_EGP=1600,PRICE_USD=33,SUB_DAYS=180;
const VF='01001606298';

const CRYPTO='TKBAMK8gPsZnVnW8PU8XSteExbidVFPU4D';

const K={u:'blo_users',s:'blo_session',r:'blo_recs',w:'blo_words',d:'blo_deps',ls:'blo_ls'};

/* ================== DB ================== */
const DB={
_g(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}},
_s(k,v){localStorage.setItem(k,JSON.stringify(v))},
users(){return this._g(K.u)},
saveU(u){this._s(K.u,u)},
findUe(e){return this.users().find(x=>x.email.toLowerCase()===e.toLowerCase())},
findUi(id){return this.users().find(x=>x.id===id)},
updU(id,p){const a=this.users();const i=a.findIndex(x=>x.id===id);if(i>=0){a[i]={...a[i],...p};this.saveU(a);return a[i]}return null},
addU(u){const a=this.users();a.push(u);this.saveU(a)},
delU(id){this.saveU(this.users().filter(x=>x.id!==id))},
recs(){return this._g(K.r)},
saveR(r){this._s(K.r,r)},
addR(r){const a=this.recs();a.unshift(r);this.saveR(a)},
delR(id){this.saveR(this.recs().filter(x=>x.id!==id))},
words(){return this._g(K.w)},
saveW(w){this._s(K.w,w)},
addW(w){const a=this.words();a.unshift(w);this.saveW(a)},
delW(id){this.saveW(this.words().filter(x=>x.id!==id))},
deps(){return this._g(K.d)},
saveD(d){this._s(K.d,d)},
addD(d){const a=this.deps();a.unshift(d);this.saveD(a)},
findD(id){return this.deps().find(x=>x.id===id)},
updD(id,p){const a=this.deps();const i=a.findIndex(x=>x.id===id);if(i>=0){a[i]={...a[i],...p};this.saveD(a);return a[i]}return null}
};

/* ================== Utils ================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function toast(m,t=''){const e=$('#tst');e.textContent=m;e.className='on'+(t?' '+t:'');clearTimeout(e._t);e._t=setTimeout(()=>{e.className=t||''},3000)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function sub(u){if(!u)return false;if(u.role==='admin')return true;if(!u.subEnd)return false;return Date.now()<u.subEnd}
function fd(ts){return new Date(ts).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})}
function ft(ts){return new Date(ts).toLocaleString('ar-EG')}
function dl(ts){return Math.max(0,Math.ceil((ts-Date.now())/864e5))}
function hp(p){let h=0;for(let i=0;i<p.length;i++)h=((h<<5)-h+p.charCodeAt(i))|0;return 'h'+Math.abs(h).toString(36)+'_'+p.length}

/* ================== Auth ================== */
let CU=null;

function notify(t,b){
if(!('Notification' in window))return;
if(Notification.permission==='granted')new Notification(t,{body:b,icon:'icon-192.png'});
else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')new Notification(t,{body:b,icon:'icon-192.png'})});
}
function upRB(){const ls=localStorage.getItem(K.ls)||'';const cu=DB.recs()[0]?.id||'';const b=$('#rBdg');if(b)b.style.display=(cu&&cu!==ls)?'inline-block':'none'}

/* ================== Telegram Action ================== */
async function tgAction(){
const p=new URLSearchParams(location.search);const a=p.get('tg_action'),id=p.get('id');
if(!a||!id)return;history.replaceState(null,'',location.pathname);
const d=DB.findD(id);if(!d){alert('غير موجود');return}
if(d.status!=='pending'){alert('تمت المعالجة');return}
if(a==='approve'){if(confirm(`تأكيد إيداع ${d.userName} بمبلغ ${d.amount}؟`)){
DB.updD(id,{status:'approved',approvedAt:Date.now()});
const u=DB.findUi(d.userId);if(u)DB.updU(d.userId,{balance:(u.balance||0)+parseFloat(d.amount)});
alert('✅ تم');tgMsg(`✅ تم تأكيد الإيداع\n👤 ${d.userName}`)}}
else if(a==='reject'){if(confirm(`رفض إيداع ${d.userName}؟`)){
DB.updD(id,{status:'rejected',rejectedAt:Date.now()});alert('❌ تم الرفض');tgMsg(`❌ تم رفض الإيداع\n👤 ${d.userName}`)}}
}

/* ================== Boot ================== */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function boot(){
ensureAdmin();
initAuth();
initMenu();
tgAction();
if('Notification' in window&&Notification.permission==='default')setTimeout(()=>Notification.requestPermission(),5000);
const s=loadS();
if(s)showApp();else showAuth();
setInterval(upRB,5000);
}
document.addEventListener('DOMContentLoaded',boot);
</script>
