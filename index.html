<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blo Trade 24</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F0B90B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0B0E11;--card:#1E2329;--card2:#2B3139;--bd:#2b3139;--g:#F0B90B;--g2:#F8D12F;--gr:#0ECB81;--rd:#F6465D;--tx:#EAECEF;--mt:#848E9C}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow-x:hidden}
#auth{position:fixed;inset:0;z-index:9000;background:radial-gradient(circle at 30% 20%,#1a1a1a,#0B0E11 70%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#auth.hide{display:none}
.abox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:32px 26px;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);position:relative;overflow:hidden}
.abox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent)}
.alg{text-align:center;margin-bottom:26px}
.alg h1{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.alg p{color:var(--mt);margin-top:8px;font-size:.9rem}
.atabs{display:flex;background:var(--bg);border-radius:14px;padding:5px;margin-bottom:22px}
.atab{flex:1;text-align:center;padding:12px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--mt);transition:.2s;font-size:.92rem}
.atab.on{background:var(--g);color:var(--bg)}
.afrm{display:none;flex-direction:column;gap:14px}
.afrm.on{display:flex}
.ff{position:relative}
.ff i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--mt);font-size:.95rem}
.ff input{width:100%;padding:15px 45px 15px 16px;background:var(--bg);border:2px solid var(--bd);border-radius:12px;color:var(--tx);font-size:1rem;outline:none;transition:.2s;font-family:'Cairo',sans-serif}
.ff input:focus{border-color:var(--g)}
.ff input::placeholder{color:var(--mt)}
.bp{background:linear-gradient(135deg,var(--g),var(--g2));color:var(--bg);border:none;padding:15px;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;transition:.2s;font-family:'Cairo',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px}
.bp:hover{transform:translateY(-2px);box-shadow:0 10px 20px -5px rgba(240,185,11,.4)}
.bp:disabled{opacity:.5;cursor:not-allowed;transform:none}
.aerr,.aok{padding:12px;border-radius:10px;font-size:.88rem;text-align:center;display:none}
.aerr{background:rgba(246,70,93,.15);border:1px solid var(--rd);color:var(--rd)}
.aok{background:rgba(14,203,129,.15);border:1px solid var(--gr);color:var(--gr)}
.aerr.on,.aok.on{display:block}
.ldr{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app{display:none;flex-direction:column;height:100vh}
#app.on{display:flex}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}
.hd .lg{display:flex;align-items:center;gap:8px}
.hd .lg-txt{font-size:1.35rem;font-weight:900;background:linear-gradient(135deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.3px}
.live-dot{width:9px;height:9px;background:var(--gr);border-radius:50%;box-shadow:0 0 10px var(--gr);animation:pls 1.6s infinite}
@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.mbtn{background:transparent;border:none;color:var(--g);font-size:1.5rem;cursor:pointer;padding:8px 10px;border-radius:10px}
.mbtn:hover{background:var(--bg)}
.bal{background:var(--bg);border:1px solid var(--g);padding:5px 12px;border-radius:20px;font-size:.8rem;color:var(--g);font-weight:700;display:flex;align-items:center;gap:5px}
.inst-btn{background:linear-gradient(135deg,var(--g),var(--g2));color:var(--bg);border:none;padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:800;cursor:pointer;display:none;align-items:center;gap:5px}
.inst-btn.show{display:flex}
#smenu{position:fixed;top:0;right:-320px;width:300px;height:100vh;background:var(--card);z-index:200;transition:right .3s;overflow-y:auto;border-left:1px solid var(--bd);display:flex;flex-direction:column}
#smenu.on{right:0}
.smh{padding:20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.smh h3{color:var(--g);font-size:1.15rem}
.cm{background:none;border:none;color:var(--mt);font-size:1.4rem;cursor:pointer}
.uib{padding:18px 20px;border-bottom:1px solid var(--bd);background:var(--bg)}
.uib .un{color:var(--tx);font-weight:700;margin-bottom:4px;font-size:1.05rem}
.uib .ue{color:var(--mt);font-size:.82rem;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis}
.pb{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:15px;font-size:.78rem;font-weight:700}
.pb.on{background:rgba(14,203,129,.2);color:var(--gr)}
.pb.off{background:rgba(246,70,93,.2);color:var(--rd)}
.pb.ad{background:rgba(240,185,11,.2);color:var(--g)}
.ml{list-style:none;padding:12px 0;flex:1}
.mi{padding:14px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s;color:var(--tx);border-right:3px solid transparent;font-weight:500;font-size:.95rem}
.mi:hover{background:var(--bg);border-right-color:var(--g)}
.mi i{width:22px;text-align:center;color:var(--g);font-size:1.05rem}
.mi.dg{color:var(--rd)}
.mi.dg i{color:var(--rd)}
.mi.ado{display:none}
.mi.ado.sh{display:flex}
.mi .bg2{margin-right:auto;background:var(--rd);color:#fff;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:800}
#mov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none}
#mov.on{display:block}
.ct{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
.bn{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:8px 0;position:sticky;bottom:0;z-index:100}
.bni{flex:1;text-align:center;padding:8px 4px;color:var(--mt);cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;font-weight:600}
.bni i{font-size:1.15rem}
.bni.on{color:var(--g)}
.home-wrap{position:relative}
.hero{text-align:center;padding:26px 0 18px;position:relative}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:180px;height:180px;background:radial-gradient(circle,rgba(240,185,11,.18),transparent 70%);filter:blur(30px);pointer-events:none}
.hero-logo{display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.hero-logo h1{font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;line-height:1.1}
.hero-live{width:14px;height:14px;background:var(--gr);border-radius:50%;box-shadow:0 0 18px var(--gr),0 0 35px rgba(14,203,129,.5);animation:pls 1.6s infinite;position:relative}
.hero-live::after{content:'';position:absolute;inset:-6px;border:2px solid rgba(14,203,129,.4);border-radius:50%;animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(14,203,129,.12);color:var(--gr);padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700;margin-top:14px;border:1px solid rgba(14,203,129,.3)}
.hero-tag .dot2{width:6px;height:6px;background:var(--gr);border-radius:50%;animation:pls 1.6s infinite}
.hero-title{font-size:1.15rem;font-weight:800;color:var(--tx);margin-top:16px;padding:0 20px;line-height:1.5}
.hero-sub{font-size:.88rem;color:var(--mt);margin-top:10px;padding:0 25px;line-height:1.7}
.gi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px}
.gic{background:linear-gradient(145deg,var(--card),#191d26);border:1px solid var(--bd);border-radius:20px;padding:22px 14px 18px;text-align:center;cursor:pointer;transition:all .28s cubic-bezier(.18,.89,.32,1.28);position:relative;color:var(--tx);display:block;overflow:hidden}
.gic::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g),transparent);opacity:0;transition:opacity .3s}
.gic:hover{transform:translateY(-6px);border-color:var(--g);background:var(--card2);box-shadow:0 15px 30px -10px rgba(240,185,11,.25)}
.gic:hover::before{opacity:1}
.gic .icn{width:56px;height:56px;border-radius:16px;background:rgba(240,185,11,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;transition:.3s}
.gic:hover .icn{background:rgba(240,185,11,.22);transform:scale(1.08)}
.gic .icn i{font-size:1.6rem;color:var(--g)}
.gic .ttl{font-size:.9rem;font-weight:700;color:var(--tx)}
.gic .ds{font-size:.7rem;color:var(--mt);margin-top:4px}
.gic .lk{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,var(--rd),#d03648);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;box-shadow:0 4px 10px rgba(246,70,93,.4)}
.gic.unlocked .lk{display:none}
.pt{font-size:1.4rem;font-weight:800;color:var(--g);margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--bd);display:flex;align-items:center;gap:10px}
.bs{background:var(--card2);color:var(--tx);border:1px solid var(--bd);padding:12px 20px;border-radius:10px;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.bs:hover{background:var(--bd)}
.bd2{background:var(--rd);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.bg3{background:var(--gr);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ip{width:100%;padding:13px 15px;background:var(--bg);border:2px solid var(--bd);border-radius:10px;color:var(--tx);font-size:.94rem;outline:none;font-family:'Cairo',sans-serif;transition:.2s}
.ip:focus{border-color:var(--g)}
textarea.ip{resize:vertical;min-height:80px}
label.lb{display:block;color:var(--mt);font-size:.82rem;margin-bottom:6px;font-weight:600}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(4px)}
#mod.on{display:flex}
.mbx{background:var(--card);border-radius:20px;padding:25px;width:100%;max-width:500px;border:1px solid var(--bd);position:relative;max-height:90vh;overflow-y:auto;animation:modIn .25s ease}
@keyframes modIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.mbx h3{color:var(--g);margin-bottom:20px;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.mc{position:absolute;top:15px;left:15px;background:none;border:none;color:var(--mt);font-size:1.4rem;cursor:pointer}
#tst{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--g);color:var(--bg);padding:12px 24px;border-radius:50px;font-weight:700;z-index:9999;opacity:0;transition:.3s;max-width:90%;text-align:center;font-size:.92rem;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#tst.on{transform:translateX(-50%) translateY(0);opacity:1}
#tst.er{background:var(--rd);color:#fff}
#tst.ok{background:var(--gr);color:#fff}
.prof-hdr{background:linear-gradient(145deg,var(--card),#191d26);border-radius:20px;padding:24px;border:1px solid var(--bd);margin-bottom:16px;position:relative;overflow:hidden}
.prof-hdr::before{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;background:radial-gradient(circle,rgba(240,185,11,.12),transparent 70%)}
.prof-top{display:flex;align-items:center;gap:16px;position:relative}
.prof-av{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900;font-size:1.8rem;flex-shrink:0;box-shadow:0 8px 20px rgba(240,185,11,.3)}
.prof-info{flex:1;min-width:0}
.prof-info .n{font-weight:800;font-size:1.15rem;color:var(--tx)}
.prof-info .e{color:var(--mt);font-size:.82rem;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.prof-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sub-box{background:linear-gradient(145deg,#1a1712,#14181d);border:1px solid var(--g);border-radius:18px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.sub-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g),var(--g2),var(--g))}
.sub-box h4{color:var(--g);font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.cd-cell{background:var(--bg);border-radius:12px;padding:12px 6px;text-align:center;border:1px solid var(--bd)}
.cd-num{font-size:1.5rem;font-weight:900;color:var(--g);line-height:1;font-variant-numeric:tabular-nums}
.cd-lbl{font-size:.65rem;color:var(--mt);margin-top:4px;font-weight:600;letter-spacing:.5px}
.sub-progress{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:14px}
.sub-progress-fill{height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:3px;transition:width .5s}
.sub-info{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mt);margin-top:8px}
.info-box{background:var(--card);border-radius:18px;padding:20px;border:1px solid var(--bd);margin-bottom:16px}
.info-box h4{color:var(--g);font-size:.95rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:.88rem}
.info-row:last-child{border-bottom:none}
.info-row .l{color:var(--mt)}
.info-row .v{font-weight:700;direction:ltr;text-align:left}
.pay-method-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.pmg-item{background:linear-gradient(145deg,var(--card),#191d26);border:1px solid var(--bd);border-radius:18px;padding:18px 20px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.pmg-item:hover{border-color:var(--g);transform:translateX(-4px);box-shadow:0 10px 25px -8px rgba(240,185,11,.2)}
.pmg-item::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--g),transparent)}
.pmg-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.5rem}
.pmg-vf .pmg-icon{background:rgba(230,0,0,.15);color:#e60000}
.pmg-bin .pmg-icon{background:rgba(240,185,11,.15);color:var(--g)}
.pmg-cry .pmg-icon{background:rgba(14,203,129,.15);color:var(--gr)}
.pmg-txt{flex:1}
.pmg-txt h4{font-size:1rem;font-weight:800;color:var(--tx);margin-bottom:3px}
.pmg-txt p{font-size:.78rem;color:var(--mt)}
.pmg-arrow{color:var(--mt);font-size:1rem}
.pay-detail{animation:fadeSlide .3s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
.pay-back{background:none;border:none;color:var(--g);font-size:1rem;cursor:pointer;padding:8px 0;margin-bottom:12px;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.pay-head{background:linear-gradient(145deg,var(--card),#191d26);border-radius:20px;padding:22px;border:1px solid var(--bd);margin-bottom:16px;position:relative;overflow:hidden}
.pay-head::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.pay-head.vf::before{background:linear-gradient(90deg,#e60000,transparent)}
.pay-head.bin::before{background:linear-gradient(90deg,var(--g),transparent)}
.pay-head.cry::before{background:linear-gradient(90deg,var(--gr),transparent)}
.pay-head .ph-icon{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:14px}
.pay-head.vf .ph-icon{background:rgba(230,0,0,.15);color:#e60000}
.pay-head.bin .ph-icon{background:rgba(240,185,11,.15);color:var(--g)}
.pay-head.cry .ph-icon{background:rgba(14,203,129,.15);color:var(--gr)}
.pay-head h3{font-size:1.3rem;font-weight:900;color:var(--tx);margin-bottom:6px}
.pay-head p{font-size:.85rem;color:var(--mt);line-height:1.6}
.pay-amt{background:var(--bg);border-radius:12px;padding:12px 16px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--g)}
.pay-amt .l{font-size:.82rem;color:var(--mt)}
.pay-amt .v{font-size:1.15rem;font-weight:900;color:var(--g)}
.steps-list{background:var(--card);border-radius:18px;padding:20px;border:1px solid var(--bd);margin-bottom:16px}
.steps-list h4{color:var(--g);font-size:.95rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--bd)}
.step:last-child{border-bottom:none}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.82rem;flex-shrink:0}
.step-txt{flex:1;font-size:.86rem;color:var(--tx);line-height:1.6}
.step-txt strong{color:var(--g)}
.copy-block{background:var(--bg);border-radius:12px;padding:14px;margin-top:10px;border:1px solid var(--bd)}
.copy-lbl{font-size:.72rem;color:var(--mt);margin-bottom:6px;font-weight:600;letter-spacing:.3px}
.copy-val{display:flex;gap:8px}
.copy-val input{flex:1;background:transparent;border:none;color:var(--tx);font-family:'Courier New',monospace;font-size:.9rem;direction:ltr;text-align:center;font-weight:700;padding:8px;outline:none}
.copy-btn{background:var(--g);color:var(--bg);border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:800;font-size:.78rem;display:flex;align-items:center;gap:5px;transition:.2s}
.copy-btn:hover{background:var(--g2)}
.fu{position:relative;border:2px dashed var(--bd);border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.25s;background:var(--bg)}
.fu:hover{border-color:var(--g);background:rgba(240,185,11,.04)}
.fu input{display:none}
.fu .fu-icon{font-size:2rem;color:var(--g);margin-bottom:8px}
.fu .fu-txt{color:var(--mt);font-size:.85rem}
.fu img{max-width:100%;max-height:160px;margin-top:12px;border-radius:10px;border:1px solid var(--bd)}
.fu.done{border-color:var(--gr);background:rgba(14,203,129,.04)}
.dh-item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.dh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dh-method{font-weight:800;color:var(--tx);font-size:.95rem}
.st{padding:4px 12px;border-radius:12px;font-size:.72rem;font-weight:800;display:inline-block}
.st.pd{background:rgba(240,185,11,.18);color:var(--g);border:1px solid rgba(240,185,11,.3)}
.st.ap{background:rgba(14,203,129,.18);color:var(--gr);border:1px solid rgba(14,203,129,.3)}

async function loadProfile(){
  if(!AUTH)return null;
  const {data,error}=await sb.from('profiles').select('*').eq('id',AUTH.id).maybeSingle();
  if(data)return data;
  console.warn('Profile missing, creating new one...',error);
  const email=(AUTH.email||'').toLowerCase();
  const meta=AUTH.user_metadata||{};
  const newProfile={
    id:AUTH.id,
    username:meta.username||email.split('@')[0],
    email:email,
    phone:meta.phone||'',
    role:email===ADMIN_EMAIL.toLowerCase()?'admin':'user',
    balance:0,
    banned:false
  };
  const {data:created,error:createErr}=await sb.from('profiles').insert(newProfile).select().single();

    console.error('Create profile error:',createErr);

    const {data:retry}=await sb.from('profiles').select('*').eq('id',AUTH.id).maybeSingle();

let cdInterval=null;
R.prof=c=>{
  if(cdInterval){clearInterval(cdInterval);cdInterval=null}
  const u=CU,s=isSub();
  const planBadge=u.role==='admin'?'<span class="pb ad">👑 أدمن</span>':s?`<span class="pb on">✅ مشترك</span>`:'<span class="pb off">⚠️ غير مشترك</span>';
  let subHTML='';

  }else if(s){
    const end=new Date(u.subscription_end).getTime();
    const start=end-SUB_DAYS*864e5;
    const elapsed=Date.now()-start;
    const pct=Math.min(100,Math.max(0,elapsed/(SUB_DAYS*864e5)*100));
    subHTML=`<div class="sub-box">
      <h4><i class="fas fa-crown"></i> اشتراكك نشط</h4>
      <div class="cd-grid" id="cdGrid">
        <div class="cd-cell"><div class="cd-num" id="cdD">0</div><div class="cd-lbl">يوم</div></div>

        <div class="cd-cell"><div class="cd-num" id="cdM">0</div><div class="cd-lbl">دقيقة</div></div>
        <div class="cd-cell"><div class="cd-num" id="cdS">0</div><div class="cd-lbl">ثانية</div></div>
      </div>
      <div class="sub-progress"><div class="sub-progress-fill" id="spFill" style="width:${pct}%"></div></div>
      <div class="sub-info"><span>بدأ: ${fmtDate(start)}</span><span>ينتهي: ${fmtDate(end)}</span></div>
    </div>`;
    setTimeout(()=>{
      function tick(){
        const diff=end-Date.now();
        if(diff<=0){clearInterval(cdInterval);toast('انتهى اشتراكك','er');refreshUser().then(()=>go('prof'));return}
        const d=Math.floor(diff/864e5);
        const h=Math.floor((diff%864e5)/36e5);
        const m=Math.floor((diff%36e5)/6e4);
        const sec=Math.floor((diff%6e4)/1000);
        const dEl=$('#cdD'),hEl=$('#cdH'),mEl=$('#cdM'),sEl=$('#cdS');
        if(dEl)dEl.textContent=d;if(hEl)hEl.textContent=h;if(mEl)mEl.textContent=m;if(sEl)sEl.textContent=sec;
      }
      tick();
      cdInterval=setInterval(tick,1000);
    },50);
  }else if(u.subscription_end&&new Date(u.subscription_end).getTime()<Date.now()){
    subHTML=`<div class="sub-box" style="border-color:var(--rd)"><h4 style="color:var(--rd)"><i class="fas fa-exclamation-circle"></i> انتهى اشتراكك</h4><p style="color:var(--mt);font-size:.85rem;line-height:1.7;">انتهت صلاحية اشتراكك. قم بتجديد الاشتراك للاستمرار.</p><button class="bp" id="renewBtn" style="width:100%;margin-top:14px;justify-content:center;"><i class="fas fa-redo"></i> تجديد الاشتراك</button></div>`;
  }else{
    subHTML=`<div class="sub-box"><h4><i class="fas fa-star"></i> لم تشترك بعد</h4><p style="color:var(--mt);font-size:.85rem;line-height:1.7;">اشترك في الخطة لمدة 6 شهور (180 يوم) مقابل 33$ فقط للوصول للتوصيات وكلمة اليوم.</p><button class="bp" id="subscribeBtn" style="width:100%;margin-top:14px;justify-content:center;"><i class="fas fa-wallet"></i> اشترك الآن</button></div>`;
  }
  c.innerHTML=`
  <h2 class="pt"><i class="fas fa-user-circle"></i> الملف الشخصي</h2>
  <div class="prof-hdr"><div class="prof-top">
    <div class="prof-av">${(u.username||'U').charAt(0).toUpperCase()}</div>
    <div class="prof-info"><div class="n">${u.username||'-'}</div><div class="e">${u.email||'-'}</div><div class="prof-badges">${planBadge}</div></div>
  </div></div>
  ${subHTML}
  <div class="info-box">
    <h4><i class="fas fa-info-circle"></i> معلومات الحساب</h4>
    <div class="info-row"><span class="l">رقم الهاتف</span><span class="v">${u.phone||'-'}</span></div>
    <div class="info-row"><span class="l">تاريخ التسجيل</span><span class="v">${fmtDate(u.created_at)}</span></div>
    <div class="info-row"><span class="l">الرصيد الحالي</span><span class="v" style="color:var(--g)">${fmtNum(u.balance||0)} ج.م</span></div>
    <div class="info-row"><span class="l">حالة الحساب</span><span class="v" style="color:${u.banned?'var(--rd)':'var(--gr)'}">${u.banned?'محظور':'نشط'}</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;">
    <button class="bs" id="chPwdBtn" style="width:100%;"><i class="fas fa-key"></i> تغيير كلمة السر</button>
    ${(CU.balance>=PRICE_EGP&&!s&&u.role!=='admin')?`<button class="bg3" id="actPlanBtn" style="width:100%;"><i class="fas fa-crown"></i> تفعيل الخطة (${PRICE_EGP} ج.م / 180 يوم)</button>`:''}
  </div>`;
  $('#chPwdBtn')?.addEventListener('click',chPwdM);
  $('#actPlanBtn')?.addEventListener('click',actPlan);
  $('#subscribeBtn')?.addEventListener('click',()=>go('dep'));
  $('#renewBtn')?.addEventListener('click',()=>go('dep'));
};
function chPwdM(){
  openM(`<button class="mc" onclick="closeM()">✕</button>
    <h3><i class="fas fa-key"></i> تغيير كلمة السر</h3>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div><label class="lb">كلمة السر الجديدة</label><input type="password" class="ip" id="nP" minlength="6"></div>
      <div><label class="lb">تأكيد كلمة السر</label><input type="password" class="ip" id="nP2" minlength="6"></div>
      <button class="bp" id="svP"><i class="fas fa-save"></i> حفظ</button>
    </div>`);
  $('#svP').onclick=async()=>{
    const n1=$('#nP').value,n2=$('#nP2').value;
    if(n1.length<6)return toast('كلمة السر قصيرة','er');
    if(n1!==n2)return toast('غير متطابقتين','er');
    const btn=$('#svP');btn.disabled=true;btn.innerHTML='<span class="ldr"></span>';

async function actPlan(){
  if(!confirm(`تفعيل الخطة مقابل ${PRICE_EGP} ج.م لمدة 180 يوم؟`))return;
  if(CU.balance<PRICE_EGP)return toast('رصيدك غير كافٍ','er');
  const end=Date.now()+SUB_DAYS*864e5;
  const {error}=await sb.from('profiles').update({balance:CU.balance-PRICE_EGP,subscription_end:new Date(end).toISOString()}).eq('id',CU.id);
  if(error)return toast(error.message,'er');
  await refreshUser();
  toast('🎉 تم تفعيل الاشتراك لمدة 180 يوم!','ok');

}

  else steps=['افتح محفظتك الرقمية (Binance / Trust Wallet / ...)','اختر شبكة <strong>Tron (TRC20)</strong>','أرسل <strong>'+PRICE_USD+' USDT</strong> إلى العنوان أدناه','احتفظ بالـ Transaction Hash','عُد إلى هنا وأكمل النموذج'];
  c.innerHTML=`
  <div class="pay-detail">
    <button class="pay-back" id="backBtn"><i class="fas fa-arrow-right"></i> رجوع للإيداع</button>

      <div style="margin-bottom:12px;"><label class="lb">رقم العملية / TX ID</label><input type="text" class="ip" id="fTx" placeholder="أدخل رقم المعاملة" style="direction:ltr;"></div>
      <div style="margin-bottom:12px;"><label class="lb">رقم الهاتف (اختياري)</label><input type="tel" class="ip" id="fPh" value="${CU.phone||''}"></div>
      <div style="margin-bottom:14px;"><label class="lb">لقطة شاشة التحويل *</label><label class="fu" id="fuBox"><input type="file" accept="image/*" id="fShot"><div class="fu-icon"><i class="fas fa-cloud-upload-alt"></i></div><div class="fu-txt" id="fuTxt">اضغط لرفع الصورة</div><img id="fPrev" style="display:none;"></label></div>

    navigator.clipboard.writeText(v).then(()=>toast('تم النسخ','ok'));
  });
  let shot=null;
  $('#fShot').onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    if(file.size>5*1024*1024)return toast('الصورة كبيرة (max 5MB)','er');
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement('canvas');
        let w=img.width,h=img.height;const mw=900;
        if(w>mw){h=h*mw/w;w=mw}
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        shot=cv.toDataURL('image/jpeg',0.75);
        const p=$('#fPrev');p.src=shot;p.style.display='block';
        $('#fuBox').classList.add('done');
        $('#fuTxt').textContent='تم رفع الصورة ✓';
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  };

    if(!shot)return toast('ارفع لقطة الشاشة','er');
    const btn=$('#submitBtn');btn.disabled=true;btn.innerHTML='<span class="ldr"></span> جاري الإرسال...';
    let screenshotUrl='';
    try{
      const blobRes=await fetch(shot);
      const blob=await blobRes.blob();
      const fileName=`${CU.id}_${Date.now()}.jpg`;
      const {error:upErr}=await sb.storage.from('proofs').upload(fileName,blob,{contentType:'image/jpeg'});

        const {data:pub}=sb.storage.from('proofs').getPublicUrl(fileName);
        screenshotUrl=pub.publicUrl;
      }
    }catch(e){console.warn('Upload failed',e)}
    const method=meta.cls==='vf'?'vodafone':meta.cls==='bin'?'binance':'crypto';
    const {error}=await sb.from('deposits').insert({user_id:CU.id,user_name:CU.username,user_email:CU.email,method,amount:amt,tx_id:tx,phone:ph,screenshot_url:screenshotUrl,status:'pending'});
    btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> تأكيد الإيداع';
    if(error){toast(error.message,'er');return}
    const methodName=method==='vodafone'?'فودافون كاش 💚':method==='binance'?'Binance Pay 🟡':'USDT TRC20 🪙';
    const caption=`🔔 <b>طلب إيداع جديد</b>\n\n👤 ${CU.username}\n📧 ${CU.email}\n📱 ${ph||'-'}\n\n💳 ${methodName}\n💰 ${amt}\n🔖 TX: <code>${tx}</code>`;
    if(screenshotUrl){
      try{
        const f=new FormData();
        f.append('chat_id',TG_CHAT);f.append('photo',screenshotUrl);f.append('caption',caption);f.append('parse_mode','HTML');
        await fetch(TG_API+'/sendPhoto',{method:'POST',body:f});
      }catch(e){console.warn('TG error',e)}
    }
    toast('✅ تم إرسال الطلب! في انتظار التأكيد','ok');
    setTimeout(()=>go('dep'),1200);
  };
}

  await renderRecos();

async function fetchPrice(sym){
  try{
    const r=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${sym.toUpperCase()}USDT`);
    if(!r.ok)return null;
    const d=await r.json();
    return {price:parseFloat(d.lastPrice),change:parseFloat(d.priceChangePercent)};
  }catch{return null}
}
async function renderRecos(){
  const list=await fetchRecos();
  const c=$('#recoList');if(!c)return;
  if(!list.length){c.innerHTML='<div class="es"><i class="fas fa-inbox ei"></i><p>لا توجد توصيات حالياً</p></div>';return}
  const syms=[...new Set(list.map(r=>r.symbol.toUpperCase()))];
  await Promise.all(syms.map(async s=>{const p=await fetchPrice(s);if(p)rPrices[s]=p}));
  c.innerHTML=list.map(r=>{
    const p=rPrices[r.symbol.toUpperCase()];
    const priceHtml=p?`<div class="p">$${p.price.toLocaleString(undefined,{maximumFractionDigits:p.price<1?6:2})}</div><div class="c ${p.change>=0?'c-up':'c-dn'}">${p.change>=0?'▲':'▼'} ${Math.abs(p.change).toFixed(2)}%</div>`:'<div class="p">--</div>';
    return `<div class="rec-card">
      <div class="rec-head">
        <div class="rec-sym"><div class="rec-sym-icon">${r.symbol.substring(0,2).toUpperCase()}</div><div class="rec-sym-txt"><h3>${r.symbol.toUpperCase()}</h3><span>/USDT</span></div></div>
        <div class="rec-price">${priceHtml}</div>
      </div>
      <div class="rec-body">
        <div class="rec-entry"><span class="l">📍 منطقة الدخول</span><span class="v">${r.entry||'-'}</span></div>
        <div class="rec-targets-label">🎯 الأهداف</div>
        <div class="rec-targets">
          <div class="rt-box"><div class="rt-lbl">هدف 1</div><div class="rt-val">${r.target1||'-'}</div></div>
          <div class="rt-box"><div class="rt-lbl">هدف 2</div><div class="rt-val">${r.target2||'-'}</div></div>
          <div class="rt-box"><div class="rt-lbl">هدف 3</div><div class="rt-val">${r.target3||'-'}</div></div>
        </div>
        <div class="rec-sl"><span class="l">🛑 وقف الخسارة</span><span class="v">${r.stop_loss||'-'}</span></div>
        ${r.notes?`<div class="rec-notes">📝 ${r.notes}</div>`:''}
        <div class="rec-time">${fmtTime(r.created_at)}</div>
      </div>
    </div>`;
  }).join('');
}

  if(b)b.style.display=(first&&first!==last)?'inline-block':'none';

/* PWA Install */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  $('#instBtn')?.classList.add('show');
});
$('#instBtn')?.addEventListener('click',async()=>{
  if(!deferredPrompt)return toast('التثبيت غير متاح على هذا المتصفح');
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted')toast('🎉 شكراً لتثبيت التطبيق','ok');
  deferredPrompt=null;
  $('#instBtn').classList.remove('show');
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;
  $('#instBtn')?.classList.remove('show');
  toast('✅ تم التثبيت بنجاح','ok');
});

/* Notifications */
async function askNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default'){try{await Notification.requestPermission()}catch{}}
}
function notify(title,body){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted'){try{new Notification(title,{body,icon:'icon-192.png'})}catch{}}
}

/* Realtime */
function initRealtime(){
  sb.channel('recos-insert').on('postgres_changes',{event:'INSERT',schema:'public',table:'recommendations'},payload=>{
    if(payload.new.hidden)return;
    window._recsCache=[payload.new,...window._recsCache];
    updateRB();
    notify('📈 توصية جديدة','تم نزول توصية جديدة على Blo Trade 24');
    if(currentPage==='recs')renderRecos();
  }).subscribe();
  sb.channel('words-insert').on('postgres_changes',{event:'INSERT',schema:'public',table:'words'},payload=>{
    if(payload.new.hidden)return;
    window._wordsCache=[payload.new,...window._wordsCache];
    notify('📅 كلمة اليوم','تم نزول كلمة اليوم الجديدة');
    if(currentPage==='words')go('words');
  }).subscribe();
  sb.channel('profile-update').on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async payload=>{
    if(payload.new.id===CU?.id){
      CU={...CU,...payload.new};
      refreshUI();
      if(payload.new.subscription_end&&new Date(payload.new.subscription_end)>Date.now()){
        notify('✅ تم تفعيل اشتراكك','تم تفعيل اشتراكك لمدة 180 يوم');
      }
    }
  }).subscribe();
}

/* Telegram */
async function tgMsg(t){
  try{const f=new FormData();f.append('chat_id',TG_CHAT);f.append('text',t);f.append('parse_mode','HTML');await fetch(TG_API+'/sendMessage',{method:'POST',body:f})}catch(e){}
}

    function fn(v){if(v===undefined||v===null||isNaN(v))return'—';return Number(v).toFixed(2)}
    function render(data){
      const items=[{k:'gold24',n:'عيار 24',d:'ذهب خالص'},{k:'gold22',n:'عيار 22',d:'91.6%'},{k:'gold21',n:'عيار 21',d:'الأكثر تداولاً'},{k:'gold18',n:'عيار 18',d:'أكستوارات'},{k:'gold14',n:'عيار 14',d:'أكستوارات'},{k:'gold12',n:'عيار 12',d:'50%'},{k:'gold10',n:'عيار 10',d:'مشغولات'},{k:'gold9',n:'عيار 9',d:'37.5%'},{k:'silverGram',n:'الفضة',d:'سعر الجرام',color:'#c0c7d1'},{k:'goldOunce',n:'الأوقية',d:'XAU / USD',color:'#f0b90b'}];
      const cur={};
      grid.innerHTML=items.map(it=>{const v=data[it.k];cur[it.k]=v;const isG=it.k==='goldOunce';const cr=isG?'$':'ج.م';const cl=it.color||'#0ecb81';return`<div style="background:#1a1d24;border-radius:16px;padding:18px 10px 14px;border:1px solid #2a2e36;text-align:center;"><div style="font-size:16px;font-weight:700;color:#eaecef;margin-bottom:2px;">${it.n}</div><div style="font-size:11px;color:#5e6673;margin-bottom:10px;">${it.d}</div><div style="font-size:24px;font-weight:900;color:${cl};letter-spacing:-.5px;line-height:1.1;">${fn(v)} <span style="font-size:13px;font-weight:600;color:#848e9c;">${cr}</span></div></div>`}).join('');
      prev=cur;
      usdEl.textContent=fn(data.usdEg);
      updEl.textContent=new Date(data.timestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      calc();zakat();
    }
    function calc(){const g=parseFloat(gG.value)||0,k=parseInt(gK.value);if(g<=0||!prev.gold24){gR.textContent='0.00 ج.م';return}let pp=prev['gold'+k];if(!pp||isNaN(pp))pp=prev.gold24*(k/24);gR.textContent=fn(pp*g)+' ج.م'}
    function zakat(){
      const gr=parseFloat(zG.value)||0,cash=parseFloat(zC.value)||0,k=parseInt(zK.value)||21;
      const pp=prev['gold'+k]||0;if(pp<=0){zR.textContent='— ج.م';zM.innerHTML='<span style="color:#f6465d;">⏳ انتظر تحميل الأسعار...</span>';return}
      const gv=gr*pp,tw=gv+cash;const p21=prev.gold21||0;if(p21<=0){zR.textContent='— ج.م';return}
      const nv=85*p21;let z=0,msg='';
      if(tw>=nv&&tw>0){z=tw*0.025;msg=`<span style="color:#0ecb81;">✅ تجب عليك الزكاة</span> — ذهب (${fn(gv)}) + نقود (${fn(cash)}) = ${fn(tw)}، النصاب (${fn(nv)}). الزكاة = <strong>${fn(z)} ج.م</strong>.`}
      else if(tw>0){msg=`<span style="color:#f6465d;">⚠️ لا تجب الزكاة</span> — ${fn(tw)} أقل من النصاب (${fn(nv)}) = 85 جرام عيار 21.`}
      else{msg='<span style="color:#f0b90b;">💡 أدخل الجرامات والنقود لحساب الزكاة.</span>'}
      zR.textContent=z>0?fn(z)+' ج.م':'0.00 ج.م';zM.innerHTML=msg;
    }
    async function fetchGold(){
      try{
        grid.style.opacity='.5';
        const [xa,xg]=await Promise.all([fetch('https://api.gold-api.com/price/XAU'),fetch('https://api.gold-api.com/price/XAG')]);
        const gd=await xa.json(),sd=await xg.json();
        const fx=await fetch('https://open.er-api.com/v6/latest/USD');const fd=await fx.json();
        const usd=fd.rates.EGP,O=31.1035,ppe=(gd.price/O)*usd,so=sd.price;
        render({gold24:ppe,gold22:ppe*22/24,gold21:ppe*21/24,gold18:ppe*18/24,gold14:ppe*14/24,gold12:ppe*12/24,gold10:ppe*10/24,gold9:ppe*9/24,silverGram:(so/O)*usd,goldOunce:gd.price,usdEg:usd,timestamp:Date.now()});
        grid.style.opacity='1';countdown=UPDATE;updateT();
      }catch(e){grid.style.opacity='1';if(!grid.children.length)grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#f6465d;background:#1a1d24;border-radius:20px;">📡 تعذر الاتصال</div>`}
    }
    function updateT(){if(timerEl)timerEl.textContent=countdown}
    function startT(){if(timerI)clearInterval(timerI);timerI=setInterval(()=>{countdown--;if(countdown<=0){countdown=UPDATE;fetchGold()}updateT()},1000)}
    gG.addEventListener('input',calc);gK.addEventListener('change',calc);
    zG.addEventListener('input',zakat);zC.addEventListener('input',zakat);zK.addEventListener('change',zakat);
    fetchGold();startT();
  })();
};

/* Telegram Action */
async function tgAction(){
  const p=new URLSearchParams(location.search);
  const a=p.get('tg_action'),id=p.get('id');
  if(!a||!id)return;
  history.replaceState(null,'',location.pathname);
  const {data:d}=await sb.from('deposits').select('*').eq('id',id).single();
  if(!d){alert('الطلب غير موجود');return}
  if(d.status!=='pending'){alert('تمت معالجة الطلب مسبقاً');return}
  if(a==='approve'){
    if(confirm(`تأكيد إيداع ${d.user_name} بمبلغ ${d.amount}؟`)){
      await sb.from('deposits').update({status:'approved',processed_at:new Date().toISOString()}).eq('id',id);
      const {data:u}=await sb.from('profiles').select('balance').eq('id',d.user_id).single();
      if(u)await sb.from('profiles').update({balance:(u.balance||0)+parseFloat(d.amount)}).eq('id',d.user_id);
      alert('✅ تم التأكيد وإضافة الرصيد');
      tgMsg(`✅ تم تأكيد الإيداع\n👤 ${d.user_name}\n💰 ${d.amount}`);
    }
  }else if(a==='reject'){
    if(confirm(`رفض إيداع ${d.user_name}؟`)){
      await sb.from('deposits').update({status:'rejected',processed_at:new Date().toISOString()}).eq('id',id);
      alert('❌ تم الرفض');
      tgMsg(`❌ تم رفض الإيداع\n👤 ${d.user_name}`);
    }
  }
}

/* BOOT */
async function boot(){
  await tgAction();
  const {data:{session}}=await sb.auth.getSession();
  if(session&&session.user){
    AUTH=session.user;
    CU=await loadProfile();
    if(CU&&!CU.banned){
      showApp();
      initRealtime();
      askNotifPermission();
      window._recsCache=await fetchRecos();
      window._wordsCache=await fetchWords();
      updateRB();
    }else{
      await sb.auth.signOut();
      showAuth();
    }
  }else{
    showAuth();
  }
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_OUT'){AUTH=null;CU=null;showAuth()}
  });
  setInterval(updateRB,8000);
}

boot();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
